<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="自家製麺キリンジの油そば（冷or温）を3Dで回して見られます。分解すると、自家製太麺・濃厚卵黄・秘伝濃厚タレが浮き上がります。">
<meta property="og:title" content="油そば（冷or温）｜自家製麺キリンジ">
<meta property="og:type" content="website">
<style>html,body{margin:0;padding:0}[hidden]{display:none!important}</style>
<title>油そば（冷or温）｜自家製麺キリンジ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700;900&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
  /* Layout: full-bleed WebGL counter scene; a quiet caption top-left, two controls bottom. Deliberately one dark look (night counter). */
  :root {
    color-scheme: dark;
    --bg: #15110e;        /* counter at night */
    --ink: #f1e6d3;       /* paper */
    --dim: #b3a48e;
    --accent: #d8a24a;    /* fried aburakasu */
    --red: #c8322c;       /* bowl lettering */
    --chip: rgba(21, 17, 14, 0.72);
    --display: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage canvas:active { cursor: grabbing; }

  .cap {
    position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(16px + env(safe-area-inset-top, 0px));
    pointer-events: none; display: grid; gap: 4px; max-width: calc(100vw - 32px);
  }
  .cap .shop { font-size: 13px; letter-spacing: 0.12em; color: var(--dim); }
  .cap h1 { margin: 0; font-family: var(--display); font-weight: 900; font-size: clamp(26px, 5vw, 40px); line-height: 1.15; text-wrap: balance; }
  .cap .hint { font-size: 13px; color: var(--dim); }
  .cap > * { text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6); }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 16px max(16px, env(safe-area-inset-left, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; pointer-events: none;
  }
  .bar button {
    pointer-events: auto; font: 700 15px/1 var(--body); color: var(--ink); background: var(--chip);
    border: 1px solid rgba(241, 230, 211, 0.28); border-radius: 999px; padding: 12px 20px; cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .bar button[aria-pressed="true"] { background: var(--accent); color: #1b130b; border-color: var(--accent); }
  .bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .label {
    position: fixed; left: 0; top: 0; pointer-events: none; white-space: nowrap;
    font: 700 14px/1 var(--body); color: var(--ink); background: var(--chip);
    border-left: 3px solid var(--accent); padding: 7px 10px 7px 9px; border-radius: 2px;
    opacity: 0; transition: opacity 0.25s;
  }
  .label.on { opacity: 1; }
  .fallback[hidden] { display: none !important; }
  .fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 0 16px; text-align: center; color: var(--dim); }
</style>
</head>
<body>


<div id="stage" aria-label="自家製麺キリンジの油そば（冷or温）の3Dモデル。ドラッグで回転、ホイールやピンチで拡大縮小できます。"></div>
<div class="cap">
  <div class="shop">自家製麺キリンジ</div>
  <h1>油そば 冷or温</h1>
  <div class="hint" id="hint">ドラッグで回す・ピンチで寄る</div>
</div>
<div class="bar">
  <button id="btnExplode" type="button" aria-pressed="false">分解する</button>
  <button id="btnSpin" type="button" aria-pressed="true">自動回転</button>
</div>
<div class="fallback" id="fallback" hidden>この端末では3D表示ができません。</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  if (!window.THREE) { document.getElementById('fallback').hidden = false; return; }
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stage = document.getElementById('stage');

  // ---------- deterministic random
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const R = (a, b) => a + (b - a) * rnd();
  const C = hex => new THREE.Color(hex).convertSRGBToLinear();

  // ---------- renderer / scene / camera
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); }
  catch (e) { document.getElementById('fallback').hidden = false; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x15110e);
  scene.fog = new THREE.Fog(0x15110e, 7, 16);

  const camera = new THREE.PerspectiveCamera(34, 1, 0.05, 120);
  camera.position.set(2.7, 2.45, 2.9);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.62, 0);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.minDistance = 1.6; controls.maxDistance = 30;
  controls.maxPolarAngle = Math.PI * 0.49;
  controls.enablePan = false;
  controls.autoRotate = !reduce; controls.autoRotateSpeed = 1.1;

  // ---------- lights
  scene.add(new THREE.HemisphereLight(0xf4f2ee, 0x2a1f18, 0.6));
  const key = new THREE.DirectionalLight(0xfff3e6, 2.0);
  key.position.set(3.2, 6, 2.2); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048); key.shadow.camera.left = -3; key.shadow.camera.right = 3;
  key.shadow.camera.top = 3; key.shadow.camera.bottom = -3; key.shadow.bias = -0.0004; key.shadow.radius = 4;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xdfe8ff, 0.6); rim.position.set(-4, 3, -3); scene.add(rim);
  const spec = new THREE.DirectionalLight(0xffffff, 0.7); spec.position.set(0.5, 4, 5); scene.add(spec);
  const fill = new THREE.PointLight(0xffd2a8, 0.35, 8); fill.position.set(-1.5, 1.6, 2.5); scene.add(fill);

  // ---------- canvas texture helper
  function canvasTex(w, h, draw, repeat) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
    return t;
  }

  // ---------- counter (wood)
  const woodTex = canvasTex(1024, 1024, (g, w, h) => {
    g.fillStyle = '#3a2416'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      const y = R(0, h), a = R(0.03, 0.12), dark = rnd() < 0.5;
      g.strokeStyle = dark ? `rgba(20,10,4,${a})` : `rgba(140,90,50,${a * 0.8})`;
      g.lineWidth = R(1, 5); g.beginPath();
      for (let x = 0; x <= w; x += 16) g.lineTo(x, y + Math.sin(x * 0.006 + i) * 6 + Math.sin(x * 0.02 + i * 3) * 2);
      g.stroke();
    }
  }, [8, 8]);
  const counter = new THREE.Mesh(new THREE.PlaneGeometry(40, 40),
    new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.62, metalness: 0.0, envMapIntensity: 0.4 }));
  counter.rotation.x = -Math.PI / 2; counter.receiveShadow = true; scene.add(counter);

  // ---------- layer groups (for the exploded view)
  const layers = {};
  ['bowl', 'soup', 'noodle', 'moyashi', 'kasu', 'chashu'].forEach(k => { layers[k] = new THREE.Group(); scene.add(layers[k]); });

  // ---------- bowl (lathe), celadon glaze
  const prof = [
    [0.0, 0.13], [0.42, 0.14], [0.72, 0.21], [0.93, 0.38], [1.06, 0.6], [1.14, 0.79],
    [1.165, 0.815], [1.2, 0.82], [1.225, 0.805],
    [1.205, 0.75], [1.12, 0.53], [0.95, 0.30], [0.7, 0.14], [0.52, 0.085],
    [0.5, 0.0], [0.42, 0.0], [0.41, 0.05], [0.0, 0.055]
  ].map(p => new THREE.Vector2(p[0], p[1]));
  const bowlMat = new THREE.MeshPhysicalMaterial({ color: C(0x93b6c4), roughness: 0.3, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.1, side: THREE.DoubleSide });
  const bowl = new THREE.Mesh(new THREE.LatheGeometry(prof, 128), bowlMat);
  bowl.castShadow = true; bowl.receiveShadow = true; layers.bowl.add(bowl);
  // red lettering on the inner rim (twice around)
  function drawLettering(g, w, h) {
    g.clearRect(0, 0, w, h);
    g.fillStyle = '#c8322c'; g.textBaseline = 'middle'; g.textAlign = 'center';
    g.font = '700 104px "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif';
    const s = '自家製麺キリンジ';
    for (let k = 0; k < 2; k++) {
      let x = w * (0.25 + k * 0.5) - 4 * 118;
      for (const ch of s) { g.fillText(ch, x + 59, h / 2 + 4); x += 118; }
    }
  }
  const textTex = canvasTex(4096, 160, drawLettering);
  textTex.wrapS = THREE.RepeatWrapping; textTex.repeat.x = -1;
  const band = new THREE.Mesh(new THREE.CylinderGeometry(1.128, 1.088, 0.13, 128, 1, true),
    new THREE.MeshPhysicalMaterial({ map: textTex, transparent: true, roughness: 0.15, clearcoat: 1, side: THREE.BackSide, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 }));
  band.position.y = 0.705; layers.bowl.add(band);

  // ---------- photo layers (user's photographs)
  const loader = new THREE.TextureLoader();
  function photoTex(src) { const t = loader.load(src); t.encoding = THREE.sRGBEncoding; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t; }
  const SOUP_Y = 0.555;
  // clear amber soup underneath (fills the edge at low angles)
  const soup = new THREE.Mesh(new THREE.CircleGeometry(1.05, 96),
    new THREE.MeshPhysicalMaterial({ color: C(0x6a4420), roughness: 0.08, clearcoat: 1, clearcoatRoughness: 0.03, transparent: true, opacity: 0.9, envMapIntensity: 0.6 }));
  soup.rotation.x = -Math.PI / 2; soup.position.y = SOUP_Y - 0.01; layers.bowl.add(soup);
  // the finished bowl seen from above, laid on a gentle dome
  const domeGeo = new THREE.CircleGeometry(1.05, 128, 0, Math.PI * 2);
  { const p = domeGeo.attributes.position;
    for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i), r = Math.hypot(x, y) / 1.05; p.setZ(i, 0.2 * Math.pow(Math.max(0, 1 - r * r), 1.3)); }
    domeGeo.computeVertexNormals(); }

  const board = new THREE.Group(); scene.add(board);
  const parts = PARTS.map(([k, src, cx, cy, w, h, label], i) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w * PX, h * PX),
      new THREE.MeshBasicMaterial({ map: photoTex(src), transparent: true, depthWrite: false, toneMapped: false, opacity: 0 }));
    const x = (cx - AXIS_X) * PX, y = 0.82 + (RIM_Y - cy) * PX;

    m.renderOrder = 10 + i; board.add(m); return m;
  });
  // ---------- steam
  const steamTex = canvasTex(128, 128, (g, w, h) => {
    const r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    r.addColorStop(0, 'rgba(255,255,255,0.55)'); r.addColorStop(0.5, 'rgba(255,255,255,0.18)'); r.addColorStop(1, 'rgba(255,255,255,0)');

  });
  steamTex.encoding = THREE.LinearEncoding;
  const steam = [];
  for (let i = 0; i < 16; i++) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: steamTex, transparent: true, depthWrite: false, opacity: 0 }));
    sp.userData = { ph: i / 16, x: R(-0.45, 0.45), z: R(-0.45, 0.45), sw: R(0.5, 1.2) };
    scene.add(sp); steam.push(sp);
  }

  // ---------- exploded view
  const LABELS = [];
  parts.forEach(p => p.userData.labels.forEach(([t, dy]) => LABELS.push([p, t, dy])));
  LABELS.push([null, '丼器', 0]);
  const labelEls = LABELS.map(([, text]) => { const d = document.createElement('div'); d.className = 'label'; d.textContent = text; document.body.appendChild(d); return d; });
  let explodeTarget = 0, explode = 0;
  const ease = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  const clamp01 = x => Math.max(0, Math.min(1, x));

  const btnE = document.getElementById('btnExplode'), btnS = document.getElementById('btnSpin');
  btnE.addEventListener('click', () => {
    explodeTarget = explodeTarget ? 0 : 1;
    btnE.setAttribute('aria-pressed', String(!!explodeTarget));
    btnE.textContent = explodeTarget ? 'もとに戻す' : '分解する';
  });
  btnS.setAttribute('aria-pressed', String(controls.autoRotate));
  btnS.addEventListener('click', () => { controls.autoRotate = !controls.autoRotate; btnS.setAttribute('aria-pressed', String(controls.autoRotate)); });

  // ---------- resize
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    camera.fov = w / h < 0.8 ? 50 : 34; camera.updateProjectionMatrix();
    if (!resize.done) { resize.done = true; if (w / h < 0.8) camera.position.multiplyScalar(1.45); }
  }
  window.addEventListener('resize', resize); resize();

  // ---------- loop (also exposed for still capture)
  const clock = new THREE.Clock();
  const v = new THREE.Vector3(), right = new THREE.Vector3(), dir = new THREE.Vector3();
  let prevFactor = 1;
  const lerp = (a, b, k) => a + (b - a) * k;
  function frame(time, dt) {
    // exploded interpolation (frame-rate independent)
    explode += (explodeTarget - explode) * (1 - Math.exp(-dt * 3.2));
    const e = ease(clamp01(explode));
    // the finished bowl lifts away and fades; the diagram rises out of the bowl
    topDisk.position.y = SOUP_Y + 0.25 * e; topMat.opacity = 1 - clamp01(explode * 2.2);
    topDisk.visible = topMat.opacity > 0.01;
    soup.material.opacity = 0.9 * (1 - clamp01(explode * 2.2)); soup.visible = soup.material.opacity > 0.01;
    board.rotation.y = Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z);
    parts.forEach(p => {
      const k = ease(clamp01((explode - 0.12 * p.userData.order) / (1 - 0.12 * 2)));
      p.position.set(p.userData.x * (0.4 + 0.6 * k), lerp(SOUP_Y + 0.1, p.userData.y, k), 0);
      p.scale.setScalar(0.55 + 0.45 * k);
      p.material.opacity = clamp01(k * 1.6);
      p.visible = p.material.opacity > 0.01;
    });
    controls.target.y = 0.62 + 1.25 * e;
    const factor = 1 + (camera.aspect < 0.8 ? 1.0 : 1.2) * e;   // pull back while the layers separate
    dir.subVectors(camera.position, controls.target).multiplyScalar(factor / prevFactor);
    camera.position.copy(controls.target).add(dir); prevFactor = factor;
    scene.fog.near = 7 * factor; scene.fog.far = 16 * factor;   // keep the counter's dark falloff at any distance
    // steam
    for (const s of steam) {
      const u = (time * 0.22 + s.userData.ph) % 1;
      s.position.set(s.userData.x + Math.sin(time * s.userData.sw + s.userData.ph * 9) * 0.12 * u, 0.85 + u * 1.5, s.userData.z);
      const sc = 0.35 + u * 0.9; s.scale.set(sc, sc, sc);
      s.material.opacity = Math.sin(Math.PI * u) * 0.2 * (1 - e);
    }
    controls.update();
    renderer.render(scene, camera);
    // labels
    const rect = renderer.domElement.getBoundingClientRect();
    LABELS.forEach(([p, , dy], i) => {
      const el = labelEls[i];
      right.setFromMatrixColumn(camera.matrixWorld, 0).setY(0).normalize();
      if (p) { v.set(0, p.position.y + dy, 0).addScaledVector(right, p.position.x + p.userData.w * 0.5 * p.scale.x + 0.08); }
      else { v.set(0, 0.42, 0).addScaledVector(right, 1.35); }
      v.project(camera);
      const x = Math.min((v.x * 0.5 + 0.5) * rect.width + 6, rect.width - el.offsetWidth - 8), y = (-v.y * 0.5 + 0.5) * rect.height;
      el.style.transform = `translate(${Math.round(x)}px, ${Math.round(y - 14)}px)`;
      el.classList.toggle('on', e > 0.9 && y > 90 && y < rect.height - 70);
    });
  }
  function loop() { const dt = Math.min(clock.getDelta(), 0.05); frame(clock.elapsedTime, dt); requestAnimationFrame(loop); }
  window.__still = (t, ex) => { explodeTarget = ex; explode = ex; frame(t, 0.016); };
  if (document.fonts && document.fonts.load) {
    document.fonts.load('700 104px "Zen Old Mincho"').then(() => {
      const c = textTex.image; drawLettering(c.getContext('2d'), c.width, c.height); textTex.needsUpdate = true;
    }).catch(() => {});
  }
  requestAnimationFrame(loop);
})();
