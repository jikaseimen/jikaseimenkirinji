<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>仮想券売機</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --page: #131110;
  --page-2: #0a0908;
  --machine: #ece6d6;
  --machine-2: #ddd6c1;
  --seam: #c7bfa6;
  --trim: #a89f84;
  --orange: #f2791c;
  --orange-2: #d6640d;
  --ink: #2a2318;
  --ink-soft: #6b6250;
  --btn: #151515;
  --btn-2: #262626;
  --btn-text: #f5f5f0;
  --price-bg: #f1ede1;
  --price-text: #2a2318;
  --lamp-on: #34d67a;
  --lamp-on-glow: rgba(52, 214, 122, 0.55);
  --lamp-off: #a39c8a;
  --lcd-bg: #04100c;
  --lcd-text: #33e7ba;
  --paper: #faf6ea;
  --paper-ink: #211c14;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
html, body { background: var(--page); overscroll-behavior: none; }
body {
  min-height: 100vh;
  font-family: 'Noto Sans JP', sans-serif;
  color: var(--ink);
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, #232019 0%, transparent 60%),
    var(--page);
  padding: 28px 12px 60px;
  display: flex;
  justify-content: center;
}
button { font-family: inherit; border: none; cursor: pointer; }
.wordmark { font-family: 'Bebas Neue', serif; letter-spacing: 0.04em; }
.mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
button:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* ===== machine shell ===== */
#machine {
  width: 100%;
  max-width: 620px;
  background: linear-gradient(180deg, var(--machine) 0%, var(--machine-2) 100%);
  border-radius: 22px;
  box-shadow: 0 50px 90px rgba(0,0,0,0.55), 0 1px 0 rgba(255,255,255,0.4) inset, 0 -1px 0 rgba(0,0,0,0.15) inset;
  padding: 18px 16px 20px;
  position: relative;
}
#machine::before {
  /* subtle panel seam under the header cluster */
  content: '';
  position: absolute;
  left: 16px; right: 16px; top: 236px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--seam), transparent);
}

/* brand plate */
.brand-plate {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.brand-plate .name { line-height: 1; }
.brand-plate .name .jp { font-size: 10px; font-weight: 900; letter-spacing: 0.25em; color: var(--ink-soft); }
.brand-plate .name .en { font-size: 22px; font-weight: 900; letter-spacing: 0.06em; }
.ticket-badge {
  background: var(--orange); color: #fff; font-weight: 900; font-size: 11px;
  padding: 5px 12px; border-radius: 4px; letter-spacing: 0.08em; transform: skew(-6deg);
  box-shadow: 0 2px 0 var(--orange-2);
}

/* lamps row */
.lamps {
  display: flex; gap: 14px; background: var(--machine-2); border: 1px solid var(--seam);
  border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; flex-wrap: wrap;
}
.lamp { display: flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; color: var(--ink-soft); }
.lamp .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--lamp-off); flex-shrink: 0; }
.lamp.on { color: var(--ink); }
.lamp.on .dot { background: var(--lamp-on); box-shadow: 0 0 8px var(--lamp-on-glow); }

/* control cluster: return lever + LCD + bill slot */
.control-row { display: flex; gap: 10px; margin-bottom: 10px; }
.return-lever {
  flex-shrink: 0; width: 76px; border-radius: 12px; border: 2px solid var(--trim);
  background: var(--machine); display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; padding: 8px 4px; transition: transform .1s;
}
.return-lever .knob {
  width: 30px; height: 30px; border-radius: 999px;
  background: radial-gradient(circle at 35% 30%, #ffb066, var(--orange) 55%, var(--orange-2) 100%);
  box-shadow: 0 3px 0 var(--orange-2), inset 0 1px 2px rgba(255,255,255,0.5);
}
.return-lever .lbl { font-size: 9px; font-weight: 900; color: var(--ink); text-align: center; line-height: 1.3; }
.return-lever:disabled { opacity: 0.45; }
.return-lever:not(:disabled):active { transform: translateY(2px); }

.lcd-wrap {
  flex: 1; min-width: 0; background: var(--lcd-bg); border-radius: 10px;
  border: 3px solid #1c1712; padding: 10px 14px; display: flex; flex-direction: column; justify-content: center;
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
}
.lcd-wrap .cap { color: rgba(51,231,186,0.55); font-size: 9px; font-weight: 700; letter-spacing: 0.15em; }
.lcd-wrap .val { color: var(--lcd-text); font-size: 20px; font-weight: 700; letter-spacing: 0.04em; text-shadow: 0 0 8px rgba(51,231,186,0.65); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.bill-slot {
  flex-shrink: 0; width: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  border: 3px solid var(--orange); border-radius: 10px; padding: 6px 4px; background: var(--machine);
  box-shadow: 0 2px 0 var(--seam);
}
.bill-slot .cap { font-size: 9px; font-weight: 700; color: var(--ink-soft); }
.bill-slot .amt { font-size: 15px; font-weight: 900; color: var(--ink); }
.bill-slot .mouth { width: 70%; height: 6px; background: #14100c; border-radius: 3px; margin-top: 2px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.8); }
.bill-slot:active { transform: translateY(1px); }

/* coin row */
.coin-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.coin-row .cap { font-size: 10px; font-weight: 700; color: var(--ink-soft); flex-shrink: 0; }
.coin-btn {
  width: 40px; height: 40px; border-radius: 999px; flex-shrink: 0;
  background: radial-gradient(circle at 35% 30%, #fff, #dcd6c4 70%);
  border: 1px solid var(--trim); color: var(--ink); font-weight: 900; font-size: 11px;
  box-shadow: 0 3px 0 var(--trim);
}
.coin-btn:active { transform: translateY(2px); box-shadow: none; }

/* ===== menu grid ===== */
.menu { margin-top: 14px; display: flex; flex-direction: column; gap: 14px; }
.cat { }
.cat-label {
  display: inline-block; background: var(--ink); color: var(--price-bg); font-size: 11px; font-weight: 900;
  letter-spacing: 0.1em; padding: 4px 10px; border-radius: 4px; margin-bottom: 6px;
}
.cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
@media (min-width: 480px) { .cat-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 580px) { .cat-grid { grid-template-columns: repeat(4, 1fr); } }

.item-btn {
  position: relative;
  background: linear-gradient(180deg, var(--btn-2), var(--btn));
  border-radius: 8px; overflow: hidden; text-align: left;
  border: 1px solid #000;
  box-shadow: 0 3px 0 #000, inset 0 1px 0 rgba(255,255,255,0.06);
  transition: opacity .15s, transform .08s;
  display: flex; flex-direction: column;
}
.item-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
.item-btn.dim { opacity: 0.38; }
.item-btn.in-cart { box-shadow: 0 0 0 2px var(--orange), 0 3px 0 var(--orange-2); }
.item-btn .lamp-dot {
  position: absolute; top: 6px; left: 6px; width: 6px; height: 6px; border-radius: 999px; background: var(--lamp-off);
}
.item-btn:not(.dim) .lamp-dot { background: var(--lamp-on); box-shadow: 0 0 6px var(--lamp-on-glow); }
.item-btn .name {
  color: var(--btn-text); font-weight: 900; font-size: 12.5px; line-height: 1.35; padding: 10px 8px 6px 16px;
  min-height: 46px; display: flex; align-items: center;
}
.item-btn .price-strip {
  background: var(--price-bg); color: var(--price-text); font-weight: 900; font-size: 13px; text-align: center;
  padding: 5px 4px; letter-spacing: 0.02em; font-family: 'JetBrains Mono', 'Courier New', monospace;
}
.item-btn .qty-chip {
  position: absolute; top: 4px; right: 4px; background: var(--orange); color: #fff; font-size: 10px; font-weight: 900;
  min-width: 16px; height: 16px; border-radius: 999px; display: flex; align-items: center; justify-content: center; padding: 0 3px;
}

/* qty stepper shown once bought, replaces price strip */
.qty-strip { background: var(--price-bg); display: flex; align-items: center; justify-content: space-between; padding: 3px 6px; }
.qty-strip button { width: 22px; height: 22px; border-radius: 6px; background: var(--btn); color: #fff; font-weight: 900; font-size: 13px; }
.qty-strip button:disabled { opacity: 0.3; }
.qty-strip .n { font-weight: 900; color: var(--price-text); font-size: 12px; font-family: 'JetBrains Mono', monospace; }

/* ===== output trays ===== */
.trays { display: flex; gap: 10px; margin-top: 16px; }
.tray { flex: 1; background: var(--machine-2); border: 1px solid var(--seam); border-radius: 10px; padding: 8px 10px; text-align: center; }
.tray .cap { font-size: 10px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; }
.tray .mouth {
  height: 26px; border-radius: 5px; background: #14100c; box-shadow: inset 0 2px 6px rgba(0,0,0,0.8);
  display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;
}
.ticket-peek {
  position: absolute; bottom: -30px; width: 78%; height: 22px; background: var(--paper); border-radius: 2px;
  transition: bottom .45s cubic-bezier(.2,.8,.2,1);
}
.ticket-peek.show { bottom: 4px; }

/* ===== floating cart button ===== */
#cart-fab {
  position: fixed; right: 18px; bottom: 18px; z-index: 45;
  background: var(--orange); color: #fff; border-radius: 999px; padding: 14px 18px;
  display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 13px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.5), 0 3px 0 var(--orange-2);
}
#cart-fab .badge { background: #fff; color: var(--orange-2); width: 20px; height: 20px; border-radius: 999px; font-size: 11px; display: flex; align-items: center; justify-content: center; }
.hidden { display: none !important; }

/* ===== cart sheet ===== */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 60; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 620px; margin: 0 auto; z-index: 61; }
.sheet-inner { background: var(--paper); color: var(--paper-ink); border-radius: 20px 20px 0 0; max-height: 85vh; display: flex; flex-direction: column; border-top: 4px solid var(--orange); }
.sheet-handle { display: flex; justify-content: center; padding: 10px 0 2px; }
.sheet-handle span { width: 40px; height: 4px; background: var(--seam); border-radius: 999px; }
.sheet-head { padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--seam); }
.sheet-head h2 { font-size: 22px; font-weight: 900; }
.sheet-close { width: 30px; height: 30px; color: var(--ink-soft); font-size: 20px; background: none; }
.type-toggle { padding: 14px 20px 6px; }
.type-toggle-inner { background: #efe9db; border-radius: 12px; padding: 4px; border: 1px solid var(--seam); display: flex; }
.type-toggle-inner button { flex: 1; padding: 9px; border-radius: 9px; font-weight: 900; font-size: 12px; background: none; color: var(--ink-soft); }
.type-toggle-inner button.active { background: var(--orange); color: #fff; }
.pickup-note { color: var(--ink-soft); font-size: 11px; text-align: center; margin-top: 6px; }
.sheet-items { flex: 1; overflow-y: auto; padding: 10px 20px; }
.sheet-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 50px 0; gap: 10px; }
.sheet-empty .icon { font-size: 44px; opacity: 0.3; }
.sheet-empty p { color: var(--ink-soft); font-size: 13px; font-weight: 700; }
.sheet-empty .balance-note { color: var(--orange-2); font-size: 12px; font-weight: 700; }
.cart-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--seam); }
.cart-row-info { flex: 1; min-width: 0; }
.cart-row-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cart-row-price { color: var(--ink-soft); font-size: 11px; font-family: 'JetBrains Mono', monospace; }
.cart-row .qty-strip { border-radius: 999px; overflow: hidden; }
.cart-row-total { color: var(--ink); font-weight: 900; font-size: 14px; width: 74px; text-align: right; flex-shrink: 0; font-family: 'JetBrains Mono', monospace; }
.sheet-footer { padding: 16px 20px 20px; border-top: 1px solid var(--seam); background: var(--paper); }
.total-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.total-row .label { color: var(--ink-soft); font-weight: 700; font-size: 13px; }
.total-row .value { color: var(--ink); font-weight: 900; font-size: 26px; font-family: 'JetBrains Mono', monospace; }
.balance-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; height: 15px; }
.balance-row .label { color: var(--ink-soft); font-size: 11px; font-weight: 700; }
.balance-row .value { color: var(--orange-2); font-size: 12px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
.issue-btn { width: 100%; background: var(--orange); color: #fff; font-weight: 900; padding: 15px; border-radius: 12px; font-size: 14px; letter-spacing: 0.03em; box-shadow: 0 3px 0 var(--orange-2); }
.issue-btn:active { transform: translateY(2px); box-shadow: none; }
.issue-btn:disabled { opacity: 0.4; }
.footer-note { color: var(--ink-soft); font-size: 10.5px; text-align: center; margin-top: 10px; line-height: 1.6; }
.clear-btn { width: 100%; margin-top: 6px; padding: 8px; color: var(--ink-soft); font-size: 11px; font-weight: 700; background: none; }

/* ===== ticket screen (printed paper ticket) ===== */
#ticket-screen {
  position: fixed; inset: 0; background: var(--page); z-index: 100;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 32px 20px; gap: 20px; text-align: center; overflow-y: auto;
}
.ticket-paper {
  width: 100%; max-width: 300px; background: var(--paper); color: var(--paper-ink);
  padding: 26px 22px; position: relative; text-align: left;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  clip-path: polygon(0% 2%, 4% 0%, 8% 2%, 12% 0%, 16% 2%, 20% 0%, 24% 2%, 28% 0%, 32% 2%, 36% 0%, 40% 2%, 44% 0%, 48% 2%, 52% 0%, 56% 2%, 60% 0%, 64% 2%, 68% 0%, 72% 2%, 76% 0%, 80% 2%, 84% 0%, 88% 2%, 92% 0%, 96% 2%, 100% 0%, 100% 100%, 0% 100%);
}
.ticket-paper .brand { text-align: center; font-size: 11px; font-weight: 900; letter-spacing: 0.15em; color: var(--ink-soft); margin-bottom: 2px; }
.ticket-paper .kind { text-align: center; font-weight: 900; font-size: 15px; letter-spacing: 0.1em; margin-bottom: 14px; }
.ticket-paper .no-label { font-size: 10px; font-weight: 700; color: var(--ink-soft); letter-spacing: 0.1em; }
.ticket-paper .no { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 26px; letter-spacing: 0.05em; margin-bottom: 10px; }
.ticket-hr { border: none; border-top: 1px dashed var(--seam); margin: 10px 0; }
.ticket-item-row { display: flex; align-items: baseline; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; margin-bottom: 4px; }
.ticket-item-row .name { font-weight: 700; }
.ticket-item-row .qty { color: var(--ink-soft); font-weight: 400; }
.ticket-total-row { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
.ticket-total-row .label { font-weight: 700; font-size: 13px; }
.ticket-total-row .value { font-weight: 900; font-size: 22px; font-family: 'JetBrains Mono', monospace; }
.ticket-type { text-align: center; font-weight: 700; font-size: 13px; margin-top: 4px; }
.ticket-pickup { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 6px; }
.ticket-pickup .big { font-size: 18px; font-weight: 900; font-family: 'JetBrains Mono', monospace; }
.ticket-instruction { background: rgba(242,121,28,0.12); border: 1px solid rgba(242,121,28,0.35); border-radius: 14px; padding: 14px; max-width: 300px; width: 100%; }
.ticket-instruction p { color: var(--orange); font-size: 12px; font-weight: 700; line-height: 1.7; }
.ticket-instruction .sub { color: rgba(255,255,255,0.55); font-weight: 400; }
.play-again-btn { background: var(--orange); color: #fff; font-weight: 900; padding: 12px 30px; border-radius: 999px; font-size: 13px; letter-spacing: 0.04em; box-shadow: 0 3px 0 var(--orange-2); }
.play-again-btn:active { transform: translateY(2px); box-shadow: none; }
</style>
</head>
<body>

<div id="machine">
  <div class="brand-plate">
    <div class="name">
      <div class="jp">自家製麺</div>
      <div class="en wordmark">KIRINJI</div>
    </div>
    <div class="ticket-badge">TICKET</div>
  </div>

  <div class="lamps">
    <div class="lamp on"><span class="dot"></span>発売中</div>
    <div class="lamp"><span class="dot"></span>お札中止</div>
    <div class="lamp"><span class="dot"></span>中止</div>
    <div class="lamp"><span class="dot"></span>つり切れ</div>
  </div>

  <div class="control-row">
    <button class="return-lever" id="return-btn" disabled>
      <span class="knob"></span>
      <span class="lbl">おつり<br>返却</span>
    </button>
    <div class="lcd-wrap">
      <span class="cap mono">ただいまの金額</span>
      <span class="val mono" id="lcd-amount">お金を入れてください</span>
    </div>
    <button class="bill-slot" data-amount="1000">
      <span class="cap">紙幣</span>
      <span class="amt">1000</span>
      <span class="mouth"></span>
    </button>
  </div>

  <div class="coin-row">
    <span class="cap">硬貨</span>
    <button class="coin-btn" data-amount="500">500</button>
    <button class="coin-btn" data-amount="100">100</button>
    <button class="coin-btn" data-amount="50">50</button>
    <button class="coin-btn" data-amount="10">10</button>
  </div>

  <div class="menu" id="menu"></div>

  <div class="trays">
    <div class="tray">
      <div class="cap">硬貨取出口</div>
      <div class="mouth"></div>
    </div>
    <div class="tray">
      <div class="cap">券取出口</div>
      <div class="mouth"><div class="ticket-peek" id="ticket-peek"></div></div>
    </div>
  </div>
</div>

<button id="cart-fab" class="hidden">
  🧾 カートを見る <span class="badge" id="cart-badge">0</span>
</button>

<!-- Cart sheet -->
<div id="cart-overlay-wrap" class="hidden">
  <div class="overlay" id="cart-overlay"></div>
  <div class="sheet">
    <div class="sheet-inner">
      <div class="sheet-handle"><span></span></div>
      <div class="sheet-head">
        <h2>選択中の商品</h2>
        <button class="sheet-close" id="close-cart-btn">✕</button>
      </div>
      <div class="type-toggle">
        <div class="type-toggle-inner">
          <button id="type-eatin" class="active">🍜 店内飲食</button>
          <button id="type-takeout">🥡 テイクアウト</button>
        </div>
        <p class="pickup-note hidden" id="pickup-note">※ 受け取り時間の目安は発券後に表示されます（約15分）</p>
      </div>
      <div class="sheet-items" id="sheet-items"></div>
      <div class="sheet-footer hidden" id="sheet-footer">
        <div class="total-row">
          <span class="label">合計金額</span>
          <span class="value" id="sheet-total">¥0</span>
        </div>
        <div class="balance-row" id="balance-row"></div>
        <button class="issue-btn" id="issue-btn">食券を発行する</button>
        <p class="footer-note">食券が発行されます。残った投入金額はおつりとして返却されます。</p>
        <button class="clear-btn" id="clear-btn">カートを空にする</button>
      </div>
    </div>
  </div>
</div>

<!-- Ticket screen -->
<div id="ticket-screen" class="hidden">
  <div class="ticket-paper">
    <div class="brand">自家製麺キリンジ</div>
    <div class="kind">食&nbsp;券</div>
    <div class="no-label">TICKET No.</div>
    <div class="no" id="ticket-no"></div>
    <hr class="ticket-hr">
    <div id="ticket-items"></div>
    <hr class="ticket-hr">
    <div class="ticket-total-row">
      <span class="label">合計</span>
      <span class="value" id="ticket-total"></span>
    </div>
    <hr class="ticket-hr">
    <p class="ticket-type" id="ticket-type"></p>
    <div class="ticket-pickup hidden" id="ticket-pickup-wrap">
      <span>🕐</span>
      <p class="big" id="ticket-pickup"></p>
    </div>
  </div>
  <div class="ticket-instruction">
    <p>📍 この画面をスタッフにお見せください<br><span class="sub">お会計はレジにてお願いいたします</span></p>
  </div>
  <button class="play-again-btn" id="play-again-btn">もう一度あそぶ</button>
</div>

<script>
"use strict";

var MENU_DATA = [
  { category: "こってり", items: [
    { name: "こってり", price: 950 },
    { name: "味玉こってり", price: 1050 },
    { name: "野菜こってり", price: 1150 },
    { name: "豚増こってり", price: 1330 },
  ]},
  { category: "あっさり", items: [
    { name: "あっさり", price: 900 },
    { name: "味玉あっさり", price: 1000 },
    { name: "野菜あっさり", price: 1050 },
    { name: "豚増あっさり", price: 1250 },
  ]},
  { category: "汁無し", items: [
    { name: "汁無し", price: 1000 },
    { name: "チーズ汁無し", price: 1150 },
    { name: "野菜汁無し", price: 1150 },
    { name: "豚マシ汁無し", price: 1350 },
  ]},
  { category: "油そば・飲み物", items: [
    { name: "【冷】油そば", price: 800 },
    { name: "【温】油そば", price: 800 },
    { name: "コーラ", price: 250 },
    { name: "ビール", price: 600 },
  ]},
  { category: "トッピング・サイド", items: [
    { name: "生卵", price: 100 },
    { name: "全部", price: 450 },
    { name: "味玉", price: 150 },
    { name: "やさい", price: 250 },
    { name: "チーズ", price: 300 },
    { name: "のり", price: 300 },
    { name: "ライス", price: 250 },
    { name: "豚増", price: 400 },
    { name: "かす増", price: 400 },
    { name: "テイクアウトあぶらかす", price: 600 },
    { name: "粒ニンニク", price: 400 },
    { name: "麺特盛", price: 350 },
    { name: "かす飯", price: 400 },
  ]},
];

var state = {
  insertedAmount: 0,
  items: [], // {name, price, quantity, category}
  isTakeout: false,
};

function formatYen(n) { return "¥" + n.toLocaleString("ja-JP"); }

function findItem(name) {
  return state.items.find(function (i) { return i.name === name; });
}

function insertMoney(amount) {
  state.insertedAmount += amount;
  render();
}

function returnChange() {
  state.insertedAmount = 0;
  render();
}

function buyItem(name, price, category) {
  if (state.insertedAmount < price) return;
  state.insertedAmount -= price;
  var existing = findItem(name);
  if (existing) {
    existing.quantity += 1;
  } else {
    state.items.push({ name: name, price: price, quantity: 1, category: category });
  }
  flashTicketTray();
  render();
}

function flashTicketTray() {
  var peek = document.getElementById("ticket-peek");
  peek.classList.remove("show");
  // force reflow so the animation can retrigger on consecutive purchases
  void peek.offsetWidth;
  peek.classList.add("show");
  clearTimeout(flashTicketTray._t);
  flashTicketTray._t = setTimeout(function () { peek.classList.remove("show"); }, 700);
}

function changeQty(name, delta) {
  var item = findItem(name);
  if (!item) return;
  var priceDiff = delta * item.price;
  if (delta > 0 && state.insertedAmount < priceDiff) return;
  item.quantity += delta;
  state.insertedAmount -= priceDiff;
  if (item.quantity <= 0) {
    state.items = state.items.filter(function (i) { return i.name !== name; });
  }
  render();
}

function clearCart() {
  state.items = [];
  state.insertedAmount = 0;
  render();
}

function cartTotal() {
  return state.items.reduce(function (s, i) { return s + i.price * i.quantity; }, 0);
}
function cartCount() {
  return state.items.reduce(function (s, i) { return s + i.quantity; }, 0);
}

/* ---------- rendering ---------- */

function buildMenuDom() {
  var menuEl = document.getElementById("menu");
  menuEl.innerHTML = "";

  MENU_DATA.forEach(function (cat) {
    var section = document.createElement("div");
    section.className = "cat";

    var label = document.createElement("div");
    label.className = "cat-label";
    label.textContent = cat.category;
    section.appendChild(label);

    var grid = document.createElement("div");
    grid.className = "cat-grid";

    cat.items.forEach(function (item) {
      var btn = document.createElement("div");
      btn.className = "item-btn";
      btn.dataset.name = item.name;
      btn.innerHTML =
        '<span class="lamp-dot"></span>' +
        '<span class="qty-chip hidden"></span>' +
        '<span class="name">' + item.name + '</span>' +
        '<div class="control-slot"></div>';
      grid.appendChild(btn);
    });

    section.appendChild(grid);
    menuEl.appendChild(section);
  });
}

function renderMenuControls() {
  document.querySelectorAll(".item-btn").forEach(function (card) {
    var name = card.dataset.name;
    var itemData = null;
    MENU_DATA.forEach(function (cat) {
      cat.items.forEach(function (it) { if (it.name === name) itemData = { price: it.price, category: cat.category }; });
    });
    var qtyItem = findItem(name);
    var qty = qtyItem ? qtyItem.quantity : 0;
    var affordable = state.insertedAmount >= itemData.price;

    card.classList.toggle("dim", !affordable && qty === 0);
    card.classList.toggle("in-cart", qty > 0);

    var chip = card.querySelector(".qty-chip");
    if (qty > 0) {
      chip.textContent = qty;
      chip.classList.remove("hidden");
    } else {
      chip.classList.add("hidden");
    }

    var slot = card.querySelector(".control-slot");
    if (qty > 0) {
      slot.innerHTML =
        '<div class="qty-strip">' +
          '<button data-action="dec">−</button>' +
          '<span class="n">' + formatYen(item_price_times(qty, itemData.price)) + '</span>' +
          '<button data-action="inc"' + (affordable ? "" : " disabled") + '>＋</button>' +
        '</div>';
      slot.querySelector('[data-action="dec"]').addEventListener("click", function (e) { e.stopPropagation(); changeQty(name, -1); });
      slot.querySelector('[data-action="inc"]').addEventListener("click", function (e) { e.stopPropagation(); changeQty(name, 1); });
    } else {
      slot.innerHTML = '<div class="price-strip">' + formatYen(itemData.price) + '</div>';
    }

    card.onclick = function () {
      if (qty === 0) buyItem(name, itemData.price, itemData.category);
    };
  });
}
function item_price_times(qty, price) { return qty * price; }

function renderCoinSlot() {
  var lcd = document.getElementById("lcd-amount");
  lcd.textContent = state.insertedAmount > 0 ? formatYen(state.insertedAmount) : "お金を入れてください";
  var returnBtn = document.getElementById("return-btn");
  returnBtn.disabled = state.insertedAmount === 0;
}

function renderFloatingBar() {
  var fab = document.getElementById("cart-fab");
  var count = cartCount();
  fab.classList.toggle("hidden", count === 0);
  var badge = document.getElementById("cart-badge");
  badge.textContent = count;
}

function renderCartSheet() {
  var itemsEl = document.getElementById("sheet-items");
  var footer = document.getElementById("sheet-footer");
  var balanceRow = document.getElementById("balance-row");

  if (state.items.length === 0) {
    var balanceNote = state.insertedAmount > 0
      ? '<p class="balance-note">' + formatYen(state.insertedAmount) + ' 投入中 — 機械のボタンを押してください</p>'
      : "";
    itemsEl.innerHTML = '<div class="sheet-empty"><div class="icon">🍜</div><p>まだ何も選んでいません</p>' + balanceNote + '</div>';
    footer.classList.add("hidden");
  } else {
    itemsEl.innerHTML = "";
    state.items.forEach(function (item) {
      var row = document.createElement("div");
      row.className = "cart-row";
      row.innerHTML =
        '<div class="cart-row-info">' +
          '<p class="cart-row-name">' + item.name + '</p>' +
          '<p class="cart-row-price">' + formatYen(item.price) + ' × ' + item.quantity + '</p>' +
        '</div>' +
        '<div class="qty-strip">' +
          '<button data-action="dec">−</button>' +
          '<span class="n">' + item.quantity + '</span>' +
          '<button data-action="inc"' + (state.insertedAmount >= item.price ? "" : " disabled") + '>＋</button>' +
        '</div>' +
        '<span class="cart-row-total">' + formatYen(item.price * item.quantity) + '</span>';
      row.querySelector('[data-action="dec"]').addEventListener("click", function () { changeQty(item.name, -1); });
      row.querySelector('[data-action="inc"]').addEventListener("click", function () { changeQty(item.name, 1); });
      itemsEl.appendChild(row);
    });
    footer.classList.remove("hidden");
    document.getElementById("sheet-total").textContent = formatYen(cartTotal());
    if (state.insertedAmount > 0) {
      balanceRow.innerHTML = '<span class="label">投入金額（残高）</span><span class="value">' + formatYen(state.insertedAmount) + '</span>';
    } else {
      balanceRow.innerHTML = "";
    }
  }
}

function render() {
  renderCoinSlot();
  renderMenuControls();
  renderFloatingBar();
  renderCartSheet();
}

/* ---------- ticket issuing ---------- */

function generateTicketNumber() {
  var now = new Date();
  var mmdd = String(now.getMonth() + 1).padStart(2, "0") + String(now.getDate()).padStart(2, "0");
  var seq = String(Math.floor(Math.random() * 900) + 100);
  return "T" + mmdd + seq;
}

function calcPickupTime() {
  var d = new Date(Date.now() + 15 * 60 * 1000);
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

function issueTicket() {
  if (state.items.length === 0) return;
  var ticketNumber = generateTicketNumber();
  var total = cartTotal();
  var isTakeout = state.isTakeout;
  var pickupTime = isTakeout ? calcPickupTime() : "";
  var items = state.items.slice();

  document.getElementById("ticket-no").textContent = ticketNumber;
  document.getElementById("ticket-total").textContent = formatYen(total);
  document.getElementById("ticket-type").textContent = isTakeout ? "🥡 テイクアウト" : "🍜 店内飲食";

  var itemsEl = document.getElementById("ticket-items");
  itemsEl.innerHTML = "";
  items.forEach(function (item) {
    var row = document.createElement("div");
    row.className = "ticket-item-row";
    row.innerHTML =
      '<span class="name">' + item.name + ' <span class="qty">×' + item.quantity + '</span></span>' +
      '<span class="price">' + formatYen(item.price * item.quantity) + '</span>';
    itemsEl.appendChild(row);
  });

  var pickupWrap = document.getElementById("ticket-pickup-wrap");
  if (isTakeout) {
    document.getElementById("ticket-pickup").textContent = pickupTime + " 頃 受け取り目安";
    pickupWrap.classList.remove("hidden");
  } else {
    pickupWrap.classList.add("hidden");
  }

  clearCart();
  closeCartSheet();
  flashTicketTray();
  document.getElementById("ticket-screen").classList.remove("hidden");
}

/* ---------- cart sheet open/close ---------- */

function openCartSheet() {
  document.getElementById("cart-overlay-wrap").classList.remove("hidden");
}
function closeCartSheet() {
  document.getElementById("cart-overlay-wrap").classList.add("hidden");
}

/* ---------- wire up static controls ---------- */

document.querySelectorAll(".bill-slot, .coin-btn").forEach(function (btn) {
  btn.addEventListener("click", function () { insertMoney(Number(btn.dataset.amount)); });
});
document.getElementById("return-btn").addEventListener("click", returnChange);
document.getElementById("cart-fab").addEventListener("click", openCartSheet);
document.getElementById("close-cart-btn").addEventListener("click", closeCartSheet);
document.getElementById("cart-overlay").addEventListener("click", closeCartSheet);
document.getElementById("clear-btn").addEventListener("click", clearCart);
document.getElementById("issue-btn").addEventListener("click", issueTicket);
document.getElementById("play-again-btn").addEventListener("click", function () {
  document.getElementById("ticket-screen").classList.add("hidden");
});

document.getElementById("type-eatin").addEventListener("click", function () {
  state.isTakeout = false;
  document.getElementById("type-eatin").classList.add("active");
  document.getElementById("type-takeout").classList.remove("active");
  document.getElementById("pickup-note").classList.add("hidden");
});
document.getElementById("type-takeout").addEventListener("click", function () {
  state.isTakeout = true;
  document.getElementById("type-takeout").classList.add("active");
  document.getElementById("type-eatin").classList.remove("active");
  document.getElementById("pickup-note").classList.remove("hidden");
});

/* ---------- init ---------- */
buildMenuDom();
render();
</script>
</body>
</html>
