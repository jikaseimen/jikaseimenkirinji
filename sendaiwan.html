<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Open Ocean — WebGPU</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;font-family:-apple-system,system-ui,"Hiragino Sans",sans-serif;color:#fff}
  canvas{display:block;width:100vw;height:100vh;height:100dvh}
  #ui{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);
      display:flex;gap:18px;align-items:center;padding:10px 16px;border-radius:14px;
      background:rgba(10,14,20,.38);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      font-size:12px;letter-spacing:.02em;transition:opacity .4s;white-space:nowrap}
  #ui label{display:flex;flex-direction:column;gap:4px;opacity:.85}
  #ui input{width:120px;accent-color:#cfe6ff}
  #hint{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:12px;opacity:.6;transition:opacity 1.5s;pointer-events:none}
  #wxbox{position:fixed;left:calc(12px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top));display:flex;gap:10px;align-items:flex-start;
    padding:9px 12px;border-radius:12px;background:rgba(10,14,20,.38);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12px;line-height:1.55;max-width:calc(100vw - 24px);transition:opacity .4s}
  #wx{display:flex;flex-direction:column}#wx b{font-weight:600;font-size:13px}#wx span{opacity:.8}
  #mode{font:inherit;font-size:11px;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 10px;cursor:pointer;white-space:nowrap}
  .btns{display:flex;flex-direction:column;gap:6px}
  #snd{font:inherit;font-size:11px;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 10px;cursor:pointer;white-space:nowrap}
  #snd.on{background:rgba(120,190,255,.35);border-color:rgba(160,210,255,.7)}
  #mode.on{background:rgba(120,190,255,.35);border-color:rgba(160,210,255,.7)}
  #hint{top:auto!important;bottom:calc(84px + env(safe-area-inset-bottom))}
  body.clean #wxbox{opacity:0;pointer-events:none}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:15px;line-height:1.7;background:#0a0d12}
  body.clean #ui,body.clean #hint{opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="wxbox"><div id="wx"></div><div class="btns"><button id="mode">実況ON</button><button id="snd">音を出す</button></div></div>
<div id="hint">ドラッグで見回す ・ ピンチ／ホイールで高さ ・ WASDで漂う ・ Hで表示切替</div>
<div id="ui">
  <label>太陽高度<input id="sun" type="range" min="-3" max="60" step="0.1" value="6"></label>
  <label>海面からの高さ<input id="alt" type="range" min="0.6" max="40" step="0.1" value="1.8"></label>
  <label>波の高さ<input id="amp" type="range" min="0.3" max="5" step="0.05" value="2.2"></label>
</div>
<div id="err"></div>
<script>
"use strict";
(async function(){
const Q = new URLSearchParams(location.search);
const errBox = document.getElementById('err');
function fail(msg){ errBox.style.display='flex'; errBox.innerHTML = msg; }
if(!navigator.gpu){ fail('このブラウザはWebGPUに対応していません。<br>Chrome / Edge 113以降、Safari 26以降でお試しください。'); return; }
const adapter = await navigator.gpu.requestAdapter({powerPreference:'high-performance'});
if(!adapter){ fail('WebGPUアダプタを取得できませんでした。'); return; }
const device = await adapter.requestDevice();
device.lost.then(i=>fail('GPUデバイスが失われました: '+i.message));
const canvas = document.getElementById('c');
const ctx = canvas.getContext('webgpu');
const presentFormat = navigator.gpu.getPreferredCanvasFormat();
ctx.configure({device, format:presentFormat, alphaMode:'opaque', usage:GPUTextureUsage.RENDER_ATTACHMENT|(Q.has('shot')?GPUTextureUsage.COPY_SRC:0)});

// ---------------------------------------------------------------- constants
const WAVE_SCALE = 2*Math.PI/68;      // wind-sea base wavelength 68 m
const GEO_ITERS = 18;
const R_EARTH = 6360e3;

// ---------------------------------------------------------------- WGSL
const COMMON = /* wgsl */`
struct U {
  viewProj : mat4x4f,
  camPos   : vec4f,   // xyz, w = time
  camRight : vec4f,   // w = tanHalfFov * aspect
  camUp    : vec4f,   // w = tanHalfFov
  camFwd   : vec4f,   // w = exposure
  sunDir   : vec4f,   // w = cloud coverage
  sunCol   : vec4f,   // rgb irradiance, w = wind angle
  res      : vec4f,
  wave     : vec4f,   // amp, scale, mean, choppiness
  ship     : vec4f,   // x, z, heading, length (0 = none)
  shipModel: mat4x4f,
  env      : vec4f,   // swell angle, swell length scale, ripple factor, whitecap factor
  env2     : vec4f,   // haze distance, fog amount, swell amp, 0
};
@group(0) @binding(0) var<uniform> u : U;
const PI = 3.14159265;
const RG = 6360000.0;

fn skyUV(d: vec3f) -> vec2f {
  let el = asin(clamp(d.y, -1.0, 1.0));
  let az = atan2(d.z, d.x);
  let x = sign(el) * sqrt(abs(el) / (PI*0.5));
  return vec2f(az/(2.0*PI) + 0.5, 0.5 - 0.5*x);
}

fn hash12(p: vec2f) -> f32 {
  var p3 = fract(vec3f(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
fn vnoise(p: vec2f) -> f32 {
  let i = floor(p); let f = fract(p);
  let w = f*f*f*(f*(f*6.0-15.0)+10.0);
  let a = hash12(i); let b = hash12(i+vec2f(1,0));
  let c = hash12(i+vec2f(0,1)); let d = hash12(i+vec2f(1,1));
  return mix(mix(a,b,w.x), mix(c,d,w.x), w.y);
}
fn fbm(p0: vec2f, oct: i32) -> f32 {
  var p = p0; var a = 0.5; var s = 0.0;
  let rot = mat2x2f(0.8, -0.6, 0.6, 0.8);
  for (var i = 0; i < oct; i++) { s += a * vnoise(p); p = rot * p * 2.03 + vec2f(17.1, 9.2); a *= 0.5; }
  return s;
}

// ---- ocean height field: sum of sharp-crested directional waves with domain drag
fn wavesRaw(p: vec2f, iters: i32) -> f32 {
  var pos = p * u.wave.y;
  var freq = 1.0; var w = 1.0; var sumV = 0.0; var sumW = 0.0; var it = 0.0;
  let t = u.camPos.w;
  let wa = u.sunCol.w;
  for (var i = 0; i < iters; i++) {
    let a = wa + sin(f32(i) * 2.3999 + 0.7) * 1.25;
    let d = vec2f(cos(a), sin(a));
    let omega = sqrt(9.81 * freq * u.wave.y);
    let x = dot(d, pos) * freq - omega * t;
    let e = exp(sin(x) - 1.0);
    let dx = e * cos(x);
    sumV += e * w; sumW += w;
    pos -= d * dx * w * u.wave.w / freq;
    freq *= 1.18; w *= 0.82; it += 1232.399963;
  }
  return sumV / sumW;
}
// long swell from a distant storm, slightly off the wind direction
fn swell(p: vec2f) -> f32 {
  let t = u.camPos.w; var h = 0.0;
  let L = array<f32,3>(170.0, 118.0, 86.0);
  let A = array<f32,3>(0.95, 0.55, 0.32);
  let D = array<f32,3>(0.55, 0.80, 0.30);
  for (var j = 0; j < 3; j++) {
    let a = u.env.x + (D[j] - 0.55) * 0.6;
    let k = 2.0*PI/(L[j]*u.env.y);
    let x = k*dot(vec2f(cos(a), sin(a)), p) - sqrt(9.81*k)*t + f32(j)*1.9;
    h += A[j] * (2.0*exp(sin(x) - 1.0) - 0.93);
  }
  return h * u.env2.z * 0.5;
}
fn oceanH(p: vec2f, iters: i32) -> f32 { return (wavesRaw(p, iters) - u.wave.z) * u.wave.x * 1.6 + swell(p); }
`;

const FULL_VS = /* wgsl */`
struct VO { @builtin(position) pos: vec4f, @location(0) uv: vec2f };
@vertex fn vsFull(@builtin(vertex_index) i: u32) -> VO {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
  var o: VO; o.pos = vec4f(p*2.0-1.0, 0.0, 1.0); o.uv = vec2f(p.x, 1.0-p.y); return o;
}
`;

// ---- Sky-view LUT: single scattering Rayleigh + Mie + ozone absorption, marched per texel
const SKYLUT = COMMON + FULL_VS + /* wgsl */`
const RT = 6460000.0;
const BR = vec3f(5.802e-6, 13.558e-6, 33.1e-6);
const BMS = 3.996e-6; const BME = 4.40e-6;
const BO = vec3f(0.650e-6, 1.881e-6, 0.085e-6);
fn rs(ro: vec3f, rd: vec3f, r: f32) -> vec2f {
  let b = dot(ro, rd); let c = dot(ro, ro) - r*r; let h = b*b - c;
  if (h < 0.0) { return vec2f(-1.0); }
  let s = sqrt(h); return vec2f(-b - s, -b + s);
}
fn ext(h: f32) -> vec3f {
  let dr = exp(-h/8000.0); let dm = exp(-h/1200.0); let dO = max(0.0, 1.0 - abs(h-25000.0)/15000.0);
  return BR*dr + vec3f(BME*dm) + BO*dO;
}
fn sunT(p: vec3f, L: vec3f) -> vec3f {
  let g = rs(p, L, RG);
  if (g.x > 0.0) { return vec3f(0.0); }
  let tm = rs(p, L, RT).y;
  let n = 12; var od = vec3f(0.0); let dt = tm / f32(n);
  for (var i = 0; i < n; i++) { let q = p + L*(f32(i)+0.5)*dt; od += ext(length(q)-RG)*dt; }
  return exp(-od);
}
@fragment fn fsLut(@location(0) uv: vec2f) -> @location(0) vec4f {
  let x = 1.0 - 2.0*uv.y;
  let el = max(sign(x)*x*x*PI*0.5, 0.0);
  let az = (uv.x - 0.5)*2.0*PI;
  let rd = vec3f(cos(el)*cos(az), sin(el), cos(el)*sin(az));
  let ro = vec3f(0.0, RG + 2.0, 0.0);
  let L = u.sunDir.xyz;
  var tMax = rs(ro, rd, RT).y;
  let g = rs(ro, rd, RG);
  if (g.x > 0.0) { tMax = g.x; }
  let mu = dot(rd, L);
  let phR = 3.0/(16.0*PI)*(1.0+mu*mu);
  let gg = 0.80;
  let phM = 3.0/(8.0*PI)*((1.0-gg*gg)*(1.0+mu*mu))/((2.0+gg*gg)*pow(1.0+gg*gg-2.0*gg*mu, 1.5));
  let n = 48;
  var T = vec3f(1.0); var S = vec3f(0.0); var tPrev = 0.0;
  for (var i = 0; i < n; i++) {
    let f = (f32(i)+0.5)/f32(n);
    let t = tMax * f*f;
    let dt = tMax * ((f32(i)+1.0)*(f32(i)+1.0) - f32(i)*f32(i)) / f32(n*n);
    let p = ro + rd*t; let h = length(p) - RG;
    let dr = exp(-h/8000.0); let dm = exp(-h/1200.0);
    let e = ext(h);
    let up = p / length(p);
    let ts = sunT(p, L);
    let scat = BR*dr*phR + vec3f(BMS*dm)*phM;
    // cheap isotropic multiple-scattering term
    let ms = (BR*dr + vec3f(BMS*dm)) * (0.10/(4.0*PI)) * smoothstep(-0.2, 0.3, dot(up, L));
    let st = exp(-e*dt);
    let Sint = (scat*ts + ms) ;
    S += T * Sint * (1.0 - st) / e;
    T *= st;
  }
  return vec4f(S * 22.0, 1.0);
}
`;

const SKYFN = /* wgsl */`
@group(0) @binding(1) var skyTex: texture_2d<f32>;
@group(0) @binding(2) var samp: sampler;
fn skyL(d: vec3f) -> vec3f {
  let dd = normalize(vec3f(d.x, max(d.y, 0.0), d.z));
  return textureSampleLevel(skyTex, samp, skyUV(dd), 0.0).rgb;
}
// cloud layer on a spherical shell, returns (rgb, alpha)
fn clouds(d: vec3f, oct: i32, soft: f32) -> vec4f {
  if (d.y <= 0.0) { return vec4f(0.0); }
  let camY = u.camPos.y;
  let H = 2200.0;
  let ro = vec3f(0.0, RG + camY, 0.0);
  let r = RG + H;
  let b = dot(ro, d); let c = dot(ro, ro) - r*r;
  let t = -b + sqrt(b*b - c);
  let p = u.camPos.xz + d.xz * t;
  let tm = u.camPos.w;
  let wind = vec2f(cos(u.sunCol.w), sin(u.sunCol.w)) * tm * 6.0;
  let q = (p + wind) * 0.00030;
  let cov = u.sunDir.w;
  let warp = vec2f(fbm(q*0.6 + 3.1, 3), fbm(q*0.6 - 7.7, 3));
  var n = fbm(q + warp*1.6, oct);
  n = n * 1.2 - 0.08;
  // erode edges with high-frequency detail
  let det = fbm(q*7.0 + warp*3.0 - wind*0.0004, max(oct-2, 2));
  n -= (det - 0.5) * 0.22;
  let dens = clamp((n - (1.0 - cov)) / max(cov*0.7*soft, 0.05), 0.0, 1.0);
  if (dens <= 0.001) { return vec4f(0.0); }
  let L = u.sunDir.xyz;
  let q2 = q + normalize(L.xz + 1e-4) * 0.35 * (1.0 - L.y);
  let warp2 = vec2f(fbm(q2*0.6 + 3.1, 3), fbm(q2*0.6 - 7.7, 3));
  let n2 = fbm(q2 + warp2*1.6, max(oct-2, 2)) * 1.2 - 0.08;
  let dens2 = clamp((n2 - (1.0 - cov)) / max(cov*0.7, 0.05), 0.0, 1.0);
  let mu = dot(d, L);
  let hg = 0.45 * (1.0 - 0.7*0.7) / pow(1.0 + 0.49 - 1.4*mu, 1.5) / (4.0*PI) + 0.55/(4.0*PI);
  let beer = mix(exp(-dens2 * 2.6), 1.0, 0.15);
  let powder = 1.0 - exp(-dens * 6.0);
  let sunC = u.sunCol.rgb;
  let amb = skyL(vec3f(0.0, 1.0, 0.0)) * 0.9 + skyL(normalize(vec3f(d.x, 0.15, d.z))) * 0.4;
  let rim = pow(max(mu, 0.0), 24.0) * (1.0 - dens) * (1.0 - dens) * 4.0;
  var col = sunC * (hg * 6.0 * beer * mix(1.0, powder, 0.6) + rim * 0.15) + amb * (0.45 + 0.5*(1.0-dens));
  let alpha = (1.0 - exp(-dens * 5.0));
  // aerial perspective fade
  let fade = exp(-t / 70000.0);
  let horizon = skyL(d);
  col = mix(horizon, col, fade);
  return vec4f(col, alpha * smoothstep(0.0, 0.04, d.y));
}
`;

const SCENE = COMMON + FULL_VS + SKYFN + /* wgsl */`
fn sunDisk(d: vec3f) -> vec3f {
  let L = u.sunDir.xyz;
  let c = dot(d, L);
  let r = 0.0065;
  let cr = cos(r);
  if (c < cos(r*1.6)) { return vec3f(0.0); }
  let x = clamp(acos(clamp(c,-1.0,1.0)) / r, 0.0, 1.6);
  let limb = pow(max(1.0 - x*x, 0.0), 0.35);
  let edge = 1.0 - smoothstep(0.92, 1.08, x);
  return u.sunCol.rgb * 1800.0 * u.env2.w * u.env2.w * vec3f(limb) * edge * vec3f(1.0, 0.98, 0.95);
}
fn skyFull(d: vec3f, oct: i32, withSun: bool) -> vec3f {
  var c = skyL(d);
  if (withSun) { c += sunDisk(d); }
  let cl = clouds(d, oct, select(1.0, 2.2, !withSun));
  return mix(c, cl.rgb, cl.a);
}

@fragment fn fsSky(@location(0) uv: vec2f) -> @location(0) vec4f {
  let ndc = vec2f(uv.x*2.0-1.0, 1.0-uv.y*2.0);
  let d = normalize(u.camFwd.xyz + u.camRight.xyz*ndc.x*u.camRight.w + u.camUp.xyz*ndc.y*u.camUp.w);
  var c = skyFull(d, 6, true);
  if (u.env2.y > 0.0) {
    let hz = skyL(normalize(vec3f(d.x, 0.02, d.z)));
    let g = vec3f(dot(hz, vec3f(0.3333))) * 1.05;
    c = mix(c, g, u.env2.y * exp(-max(d.y, 0.0) * mix(14.0, 2.5, u.env2.y)));
  }
  // below the geometric horizon (rarely visible): blend to sea haze
  return vec4f(min(c, vec3f(60000.0)), 1.0);
}

struct OO {
  @builtin(position) pos: vec4f,
  @location(0) wp: vec3f,
  @location(1) hgeo: f32,
};
@vertex fn vsOcean(@location(0) off: vec2f) -> OO {
  let xz = u.camPos.xz + off;
  let h = oceanH(xz, ${GEO_ITERS});
  let drop = dot(off, off) / (2.0 * RG);
  let wp = vec3f(xz.x, h - drop, xz.y);
  var o: OO;
  o.pos = u.viewProj * vec4f(wp, 1.0);
  o.wp = wp; o.hgeo = h;
  return o;
}

// capillary / short-gravity ripples: analytic slopes, faded by pixel footprint (variance moved into roughness)
fn ripples(p: vec2f, fp: f32) -> vec3f {
  var g = vec2f(0.0); var vr = 0.0;
  var k = 2.0*PI/2.4; var s = 0.030 * u.env.z;
  let t = u.camPos.w;
  // wind gusts: patchy ripple strength drifting downwind (cat's paws)
  let wdir = vec2f(cos(u.sunCol.w), sin(u.sunCol.w));
  let gust = 0.55 + 0.9 * fbm(p*0.010 - wdir*t*0.05, 4);
  for (var i = 0; i < 22; i++) {
    let fi = f32(i);
    let a = u.sunCol.w + sin(fi*12.9898 + 1.3) * 1.6;
    let d = vec2f(cos(a), sin(a));
    let om = sqrt(9.81*k + 7.4e-5*k*k*k);
    let ph = k*dot(d, p) - om*t + fi*2.39;
    let lam = 2.0*PI/k;
    let fade = 1.0 - smoothstep(0.5, 1.5, fp*6.0/lam);
    let si = s * gust * (0.7 + 0.6*fract(sin(fi*78.233)*43758.5));
    g += d * si * cos(ph) * fade;
    vr += 0.5*si*si*(1.0 - fade);
    k *= 1.17 + 0.08*fract(sin(fi*39.425)*24634.6); s *= 0.95;
  }
  return vec3f(g, vr);
}

fn ggx(N: vec3f, V: vec3f, L: vec3f, rough: f32) -> f32 {
  let H = normalize(V + L);
  let NdH = max(dot(N, H), 0.0);
  let NdL = max(dot(N, L), 0.0);
  let NdV = max(dot(N, V), 1e-3);
  let a = rough*rough; let a2 = a*a;
  let dd = NdH*NdH*(a2-1.0)+1.0;
  let D = a2 / (PI*dd*dd);
  let k = a*0.5;
  let G = (NdL/(NdL*(1.0-k)+k)) * (NdV/(NdV*(1.0-k)+k));
  let F = 0.02 + 0.98*pow(1.0 - max(dot(V,H),0.0), 5.0);
  return D*G*F/(4.0*NdV) ;
}

@fragment fn fsOcean(i: OO, @builtin(front_facing) ff: bool) -> @location(0) vec4f {
  let cam = u.camPos.xyz;
  let toCam = cam - i.wp;
  let dist = length(toCam);
  let V = toCam / dist;
  let L = u.sunDir.xyz;

  // pixel footprint on the surface (stretched at grazing angles)
  let pixA = 2.0 * u.camUp.w * u.res.w;
  let fp = dist * pixA / sqrt(max(V.y, 0.015));
  let nMax = log((2.0*PI/u.wave.y) / (5.0*fp)) / log(1.18);
  let iters = i32(clamp(nMax, 5.0, 40.0));
  let e = clamp(fp*1.0, 0.03, 80.0);
  let p = i.wp.xz;
  let h0 = oceanH(p, iters);
  let hx = oceanH(p + vec2f(e, 0.0), iters);
  let hz = oceanH(p + vec2f(0.0, e), iters);
  let rp = ripples(p, fp);
  var N = normalize(vec3f(-(hx - h0)/e - rp.x, 1.0, -(hz - h0)/e - rp.y));
  // slope variance of the octaves we dropped
  let waveVar = 0.016 * (1.0 - clamp(f32(iters)/40.0, 0.0, 1.0)) * clamp(u.wave.x/2.0, 0.3, 2.0);
  // unresolved detail: flatten the normal and move the lost slope into roughness (Toksvig-style)
  let flat = smoothstep(0.12, 2.5, fp);
  N = normalize(mix(N, vec3f(0.0, 1.0, 0.0), 0.65*flat));
  let slopeVar = rp.z + waveVar + 0.02*flat;
  let NdV = max(dot(N, V), 0.0);
  var R = reflect(-V, N);
  R.y = abs(R.y) + 0.002;
  R = normalize(R);
  let F = 0.02 + 0.98*pow(1.0 - NdV, 5.0);

  let refl = skyFull(R, select(3, 5, dist < 600.0), false);


  // sun glitter
  let alpha = sqrt(0.0025 + 2.0*slopeVar);
  let spec = min(ggx(N, V, L, sqrt(alpha)) * max(dot(N, L), 0.0), 4000.0);
  let sunVis = smoothstep(-0.02, 0.02, L.y);

  // body color: deep scattering + subsurface light through crests
  let amb = skyL(vec3f(0.0,1.0,0.0)) * 0.6 + skyL(normalize(vec3f(-L.x, 0.2, -L.z))) * 0.4;
  let A = u.wave.x;
  let hrel = clamp(i.hgeo / (A*2.2) + 0.5, 0.0, 1.0);

    }

  var col = water * (1.0 - F) + refl * F + spec * u.sunCol.rgb * sunVis;

  let vd = -V;

  let hazeG = mix(haze, vec3f(dot(haze, vec3f(0.3333)))*1.05, u.env2.y);
  col = mix(col, hazeG, fogA);

  return vec4f(min(col, vec3f(60000.0)), 1.0);
}

fn aces(x: vec3f) -> vec3f {

function buildMesh(){

  const q = Math.pow(rMax/rMin, 1/(NR-2));
  const verts = new Float32Array((1 + (NR-1)*NS) * 2);

  for(let i=1;i<NR;i++){
    const r = rMin*Math.pow(q, i-1);
    for(let j=0;j<NS;j++){ const a = j/NS*Math.PI*2; verts[k++] = Math.cos(a)*r; verts[k++] = Math.sin(a)*r; }
  }
  const idx = new Uint32Array(NS*3 + (NR-2)*NS*6);
  let m = 0;
  for(let j=0;j<NS;j++){ idx[m++]=0; idx[m++]=1+j; idx[m++]=1+(j+1)%NS; }
  for(let i=1;i<NR-1;i++){
    const a0 = 1+(i-1)*NS, a1 = 1+i*NS;
    for(let j=0;j<NS;j++){
      const j1=(j+1)%NS;
      idx[m++]=a0+j; idx[m++]=a1+j; idx[m++]=a1+j1;
      idx[m++]=a0+j; idx[m++]=a1+j1; idx[m++]=a0+j1;

  const ib = device.createBuffer({size:idx.byteLength, usage:GPUBufferUsage.INDEX, mappedAtCreation:true});

function solarPos(date, lat, lon){
  const rad=Math.PI/180, n = date.getTime()/86400000 + 2440587.5 - 2451545.0;
  const L=(280.460+0.9856474*n)%360, g=(357.528+0.9856003*n)*rad;
  const lam=(L+1.915*Math.sin(g)+0.020*Math.sin(2*g))*rad, eps=(23.439-0.0000004*n)*rad;
  const ra=Math.atan2(Math.cos(eps)*Math.sin(lam), Math.cos(lam)), dec=Math.asin(Math.sin(eps)*Math.sin(lam));
  const gmst=((18.697374558+24.06570982441908*n)%24+24)%24;
  const H=(gmst*15+lon)*rad-ra, ph=lat*rad;
  const el=Math.asin(Math.sin(ph)*Math.sin(dec)+Math.cos(ph)*Math.cos(dec)*Math.cos(H));
  const az=Math.atan2(-Math.sin(H), Math.tan(dec)*Math.cos(ph)-Math.sin(ph)*Math.cos(H));
  return {el:el/rad, az:((az/rad)+360)%360};
}

  uData.set([cam.x,cam.y,cam.z,t], 16);
  uData.set([...right, tanH*aspect], 20);
  uData.set([...upv, tanH], 24);
  const exposure = 0.55 * Math.pow(Math.max(0.05, 22/ (sunC[1]+ 4.0)), 0.35) ;
  uData.set([...fwd, +(Q.get('exp') ?? 1)*exposure], 28);
  uData.set([...sunL, S.cover], 32);
  uData.set([...sunC, S.wind], 36);
  uData.set([W,H,1/W,1/H], 40);
  uData.set([S.amp, S.waveScale, waveMean, S.chop], 44);
  uData.set([S.swellDir, S.swellLen, S.ripple, S.whitecap], 68);
  uData.set([S.haze, S.fog, S.swellAmp, S.sunDim], 72);
  const shp = life.ship;
  if(shp){
    const th=Math.atan2(shp.hx, shp.hz);
    let rgt=[Math.cos(th),0,-Math.sin(th)], upw=[0,1,0], fw=[Math.sin(th),0,Math.cos(th)];
    fw=rotAround(fw,rgt,-shp.pitch); upw=rotAround(upw,rgt,-shp.pitch);
    rgt=rotAround(rgt,fw,shp.roll); upw=rotAround(upw,fw,shp.roll);
    uData.set([shp.x, shp.z, th, shp.mesh.L], 48);
    uData.set([...rgt,0, ...upw,0, ...fw,0, shp.x, shp.heave, shp.z, 1], 52);
  } else uData.set([0,0,0,0], 48);
  if(birdCount) device.queue.writeBuffer(birdBuf, 0, birdInst, 0, birdCount*8);
  device.queue.writeBuffer(ubo, 0, uData);

  const enc = device.createCommandEncoder();
  if(lutDirty){
    const p = enc.beginRenderPass({colorAttachments:[{view:lutTex.createView(), loadOp:'clear', storeOp:'store', clearValue:[0,0,0,1]}]});
    p.setPipeline(lutPipe); p.setBindGroup(0, lutBG); p.draw(3); p.end();
    lutDirty = false;
  }
  {
    const p = enc.beginRenderPass({
      colorAttachments:[{view:hdrTex.createView(), loadOp:'clear', storeOp:'store', clearValue:[0,0,0,1]}],
      depthStencilAttachment:{view:depthTex.createView(), depthLoadOp:'clear', depthStoreOp:'discard', depthClearValue:0}});
    p.setBindGroup(0, sceneBG);
    p.setPipeline(skyPipe); p.draw(3);
    p.setPipeline(oceanPipe); p.setVertexBuffer(0, mesh.vb); p.setIndexBuffer(mesh.ib, 'uint32'); p.drawIndexed(mesh.count);
    if(shp){ p.setPipeline(shipPipe); p.setVertexBuffer(0, shp.mesh.buf); p.draw(shp.mesh.count); }
    if(birdCount){ p.setPipeline(birdPipe); p.setVertexBuffer(0, birdMesh.buf); p.setVertexBuffer(1, birdBuf); p.draw(birdMesh.count, birdCount); }
    p.end();
  }
  const fs = (pipe, bg, view)=>{ const p=enc.beginRenderPass({colorAttachments:[{view, loadOp:'clear', storeOp:'store', clearValue:[0,0,0,1]}]});
    p.setPipeline(pipe); p.setBindGroup(0,bg); p.draw(3); p.end(); };
  fs(brightPipe, bgBright, bloomA.createView());
  for(let k=0;k<4;k++){ fs(blurHPipe, bgBlurH, bloomB.createView()); fs(blurVPipe, bgBlurV, bloomA.createView()); }
  const outTex = ctx.getCurrentTexture();
  fs(compPipe, bgComp, outTex.createView());
  let rb=null;
  if(Q.has('shot') && frames===+(Q.get('shot')||3)){
    const bpr = Math.ceil(W*4/256)*256;
    rb = device.createBuffer({size:bpr*H, usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
    enc.copyTextureToBuffer({texture:outTex}, {buffer:rb, bytesPerRow:bpr}, [W,H]);
    rb.bpr=bpr;
  }
  device.queue.submit([enc.finish()]);
  if(rb){ rb.mapAsync(GPUMapMode.READ).then(()=>{ const src=new Uint8Array(rb.getMappedRange());
    const c2=document.createElement('canvas'); c2.width=W; c2.height=H; const x=c2.getContext('2d'); const img=x.createImageData(W,H);
    const bgra = presentFormat.startsWith('bgra');
    for(let y=0;y<H;y++) for(let i=0;i<W;i++){ const s=y*rb.bpr+i*4, d=(y*W+i)*4;
      img.data[d]=src[s+(bgra?2:0)]; img.data[d+1]=src[s+1]; img.data[d+2]=src[s+(bgra?0:2)]; img.data[d+3]=255; }
    x.putImageData(img,0,0); window.__png=c2.toDataURL('image/png'); }); }
  frames++; window.__frames = frames;
  if(Q.has('shot') && frames > +(Q.get('shot')||3)) return;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
