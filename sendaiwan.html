<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>仙台湾ライブ</title>
<meta name="description" content="仙台湾ライブ：仙台湾の今の天気・波・太陽の位置をそのまま3DCGの海に。ブラウザで見られます。">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;font-family:-apple-system,system-ui,"Hiragino Sans",sans-serif;color:#fff}
  canvas{display:block;width:100vw;height:100vh;height:100dvh}
  #ui{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);
      display:flex;gap:18px;align-items:center;padding:10px 16px;border-radius:14px;
      background:rgba(10,14,20,.38);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      font-size:12px;letter-spacing:.02em;transition:opacity .4s;white-space:nowrap}
  #ui label{display:flex;flex-direction:column;gap:4px;opacity:.85}
  #ui input{width:120px;accent-color:#cfe6ff}
  #hint{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:12px;opacity:.6;transition:opacity 1.5s;pointer-events:none}
  #bay{position:fixed;left:calc(12px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top));
    font:inherit;color:#fff;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;
    padding:9px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.35);
    background:rgba(10,14,20,.38);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .4s}
  #bay b{font-size:14px;font-weight:600;letter-spacing:.04em}
  #bay small{font-size:11px;opacity:.85}
  #bay.on{background:rgba(70,140,220,.45);border-color:rgba(170,215,255,.8)}
  body.clean #bay{opacity:0;pointer-events:none}
  #hint{top:auto!important;bottom:calc(84px + env(safe-area-inset-bottom))}
  @media (max-width:600px){
    #ui{left:8px;right:8px;transform:none;gap:10px;padding:8px 10px;justify-content:space-between}
    #ui label{flex:1 1 0;min-width:0;font-size:11px}
    #ui input{width:100%}
  }
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:15px;line-height:1.7;background:#0a0d12}
  body.clean #ui,body.clean #hint{opacity:0;pointer-events:none}
  /* 制作表示 */
  #ui{bottom:calc(24px + env(safe-area-inset-bottom))}
  #hint{bottom:calc(94px + env(safe-area-inset-bottom))!important}
  #credit{position:fixed;left:0;right:0;bottom:calc(5px + env(safe-area-inset-bottom));text-align:center;
    font-size:10px;letter-spacing:.06em;opacity:.6;pointer-events:none;z-index:5;transition:opacity .4s;
    text-shadow:0 1px 3px rgba(0,0,0,.6)}
  body.clean #credit{opacity:0}
  body.litemode #ui label:last-child{display:none}
  /* 共有 */
  #topR{position:fixed;right:calc(12px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));
    display:flex;gap:8px;align-items:center;transition:opacity .4s}
  body.clean #topR{opacity:0;pointer-events:none}
  #riseBtn{font:inherit;color:#fff;cursor:pointer;display:flex;align-items:center;gap:6px;
    padding:6px 11px 6px 9px;border-radius:999px;border:1px solid rgba(255,200,140,.45);
    background:rgba(40,22,10,.38);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-align:left}
  #riseBtn svg{width:16px;height:16px;flex:none;color:#ffc98a}
  #riseBtn span{display:flex;flex-direction:column;line-height:1.15}
  #riseBtn small{font-size:9.5px;opacity:.8;letter-spacing:.04em}
  #riseBtn b{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  #riseBtn.on{background:rgba(200,110,40,.5);border-color:rgba(255,210,160,.9)}
  #riseBtn i{font-style:normal}
  @media (max-width:600px){ #shareBtn{padding:11px 12px} #shareBtn em{display:none} #riseBtn{padding:5px 9px 5px 7px} #riseBtn i{display:none} }
  #shareBtn{
    font:inherit;font-size:14px;font-weight:600;color:#fff;cursor:pointer;display:flex;align-items:center;gap:6px;
    padding:10px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.35);
    background:rgba(10,14,20,.38);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .4s}
  #shareBtn svg{width:16px;height:16px}
  #share{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.55);z-index:10}
  #share.open{display:flex}
  #share .box{width:min(420px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:16px;border-radius:18px;
    background:rgba(16,22,30,.92);border:1px solid rgba(255,255,255,.15);display:flex;flex-direction:column;gap:10px}
  #share .head{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600}
  #share .x{font:inherit;font-size:22px;line-height:1;color:#fff;background:none;border:0;cursor:pointer;padding:4px 8px}
  #share img{width:100%;max-height:42dvh;object-fit:contain;border-radius:10px;background:#000}
  #share textarea{font:inherit;font-size:13px;line-height:1.5;color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);
    border-radius:10px;padding:8px 10px;resize:none;height:92px}
  #share .b{font:inherit;font-size:14px;font-weight:600;color:#fff;cursor:pointer;padding:12px;border-radius:12px;
    border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
  #share .b.main{background:#2f7fd6;border-color:#2f7fd6}
  #share .b.xb{background:#000;border-color:rgba(255,255,255,.35)}
  #share .b.line{background:#06c755;border-color:#06c755}
  #share .row{display:flex;gap:8px} #share .row .b{flex:1}
  #share .note{font-size:11px;opacity:.7;line-height:1.5}
  #share .msg{font-size:12px;color:#9fd4ff;min-height:1em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="bay"><b>仙台湾ライブ</b><small></small></button>
<div id="topR">
<button id="riseBtn" aria-label="日の出までの時間（タップで日の出の海を見る）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 18h18"/><path d="M7 18a5 5 0 0 1 10 0"/><path d="M12 6v3"/><path d="M5.6 10.6l1.8 1.4"/><path d="M18.4 10.6l-1.8 1.4"/><path d="M8 21h8"/></svg><span><small>日の出まで</small><b>--:--</b></span></button>
<button id="shareBtn" aria-label="仙台湾ライブを共有"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg><em style="font-style:normal">共有</em></button>
</div>
<div id="share" role="dialog" aria-modal="true" aria-label="共有">
  <div class="box">
    <div class="head"><span>仙台湾ライブを送る</span><button class="x" id="shClose" aria-label="閉じる">×</button></div>
    <img id="shImg" alt="仙台湾ライブの画像">
    <textarea id="shText" aria-label="投稿する文章"></textarea>
    <button class="b main" id="shNative">画像つきで送る（X・LINE など）</button>
    <div class="row">
      <a class="b xb" id="shX" target="_blank" rel="noopener">X に投稿</a>
      <a class="b line" id="shLine" target="_blank" rel="noopener">LINE で送る</a>
    </div>
    <div class="row">
      <button class="b" id="shCopy">画像をコピー</button>
      <a class="b" id="shSave" download="sendaiwan.jpg">画像を保存</a>
    </div>
    <div class="msg" id="shMsg"></div>
    <div class="note" id="shNote"></div>
  </div>
</div>
<div id="hint">ドラッグで見回す ・ ピンチ／ホイールで高さ ・ WASDで漂う ・ Hで表示切替</div>
<div id="ui">
  <label>太陽高度<input id="sun" type="range" min="-3" max="60" step="0.1" value="6"></label>
  <label>海面からの高さ<input id="alt" type="range" min="0.6" max="40" step="0.1" value="1.8"></label>
  <label>波の高さ<input id="amp" type="range" min="0.3" max="5" step="0.05" value="2.2"></label>
  <label>音量<input id="vol" type="range" min="0" max="1" step="0.01" value="0.6"></label>
</div>

<div id="credit">制作-カスラーメン自家製麺キリンジ</div>
<script>
// ================================================================ 日の出カウントダウン（仙台・海の水平線、計算値）
"use strict";
(function(){
  const LAT = 38.27, LON = 140.87;
  function sunEl(date){
    const rad=Math.PI/180, n = date.getTime()/86400000 + 2440587.5 - 2451545.0;
    const L=(280.460+0.9856474*n)%360, g=(357.528+0.9856003*n)*rad;
    const lam=(L+1.915*Math.sin(g)+0.020*Math.sin(2*g))*rad, eps=(23.439-0.0000004*n)*rad;
    const ra=Math.atan2(Math.cos(eps)*Math.sin(lam), Math.cos(lam)), dec=Math.asin(Math.sin(eps)*Math.sin(lam));
    const gmst=((18.697374558+24.06570982441908*n)%24+24)%24;
    const H=(gmst*15+LON)*rad-ra, ph=LAT*rad;
    const el=Math.asin(Math.sin(ph)*Math.sin(dec)+Math.cos(ph)*Math.cos(dec)*Math.cos(H));
    const az=Math.atan2(-Math.sin(H), Math.tan(dec)*Math.cos(ph)-Math.sin(ph)*Math.cos(H));
    return {el:el/rad, az:((az/rad)+360)%360};
  }
  const H0 = -0.833;   // 太陽の上の縁が水平線に出る高さ（大気の屈折を含む）
  function nextSunrise(from){
    let t = from.getTime(), prev = sunEl(new Date(t)).el;
    for(let i=0;i<800;i++){   // 2分きざみで最大約27時間先まで
      const t2 = t + 120000, e2 = sunEl(new Date(t2)).el;
      if(prev < H0 && e2 >= H0){
        let a=t, b=t2; for(let k=0;k<14;k++){ const m=(a+b)/2; if(sunEl(new Date(m)).el < H0) a=m; else b=m; }
        return new Date(b);
      }
      t = t2; prev = e2;
    }
    return null;
  }
  const btn = document.getElementById('riseBtn'), lab = btn.querySelector('small'), val = btn.querySelector('b');
  const hm = d => d.toLocaleTimeString('ja-JP', {hour:'numeric', minute:'2-digit', timeZone:'Asia/Tokyo'});
  let rise = null;
  function update(){
    const now = new Date();
    if(!rise || now - rise > 30*60000) rise = nextSunrise(new Date(now.getTime() - 30*60000));
    if(!rise){ val.textContent = '--:--'; return; }
    const diff = rise - now;
    if(diff <= 0){                       // 日の出から30分までは「日の出から○分」
      lab.innerHTML = '日の出<i> '+hm(rise)+' </i>から';
      val.textContent = Math.floor(-diff/60000)+'分';
    } else {
      const m = Math.ceil(diff/60000), h = Math.floor(m/60), mm = m%60;
      lab.innerHTML = '日の出<i> '+hm(rise)+' </i>まで';
      val.textContent = h > 0 ? h+'時間'+String(mm).padStart(2,'0')+'分' : (m <= 10 ? Math.ceil(diff/1000/60)+'分 まもなく' : mm+'分');
    }
    btn.title = '仙台の日の出 '+hm(rise)+'（計算値。雲で見えないこともあります）';
  }
  update(); setInterval(update, 15000);
  // タップ：日の出の瞬間の海を先に見る（もう一度押すか、左上のボタンで実況に戻る）
  btn.onclick = ()=>{
    if(!rise) return;
    if(btn.classList.contains('on')){ btn.classList.remove('on'); document.getElementById('bay').click(); return; }
    const p = sunEl(new Date(rise.getTime() + 4*60000));
    if(window.__showSun){ window.__showSun(Math.max(0.4, p.el), p.az); btn.classList.add('on'); }
  };
  document.getElementById('bay').addEventListener('click', ()=>btn.classList.remove('on'));
  window.__riseOff = ()=>btn.classList.remove('on');
})();
</script>
<script>
// ================================================================ スマホ用の軽い海（WebGL版）
// WebGPU が無い・止まった端末で自動的に使う。実況・太陽・共有は本体と同じ考え方。
"use strict";
window.__startLite = function(reason){
  if(window.__liteOn) return; window.__liteOn = true;
  const Q = new URLSearchParams(location.search);
  const $ = id => document.getElementById(id);
  const errBox = $('err'); errBox.style.display = 'none';
  const old = $('c'); old.style.display = 'none';
  const cv = document.createElement('canvas'); cv.id = 'c2'; old.after(cv);
  const gl = cv.getContext('webgl', {antialias:false, alpha:false, depth:false, stencil:false, preserveDrawingBuffer:false, powerPreference:'high-performance'})
          || cv.getContext('experimental-webgl');
  if(!gl){ errBox.style.display='flex'; errBox.innerHTML='この端末では3D表示ができません。<br><small>'+navigator.userAgent+'</small>'; return; }
  document.body.classList.add('litemode');

  // ------------------------------------------------------------ shader
  const VS = 'attribute vec2 p; varying vec2 v; void main(){ v=p; gl_Position=vec4(p,0.,1.); }';
  const FS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 v;
uniform vec3 uPos, uF, uR, uU, uSun, uSunCol;
uniform vec2 uTan, uCloud;
uniform float uT;
uniform vec4 uW[16];     // xy = 波数ベクトル, z = 振幅, w = 角速度
uniform vec4 uEnv;       // 雲量, 霞の距離, 白波, 基準振幅
uniform vec4 uEnv2;      // 露出, 1画素の角度, 雨, さざ波

float hash(vec2 p){ p = fract(p*vec2(0.1031, 0.1030)); p += dot(p, p.yx+33.33); return fract((p.x+p.y)*p.x); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x), f.y); }
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<5;i++){ s+=a*noise(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return s; }

float dayF(){ return smoothstep(-0.06, 0.45, uSun.y); }
float lowF(){ return smoothstep(-0.16, 0.0, uSun.y)*(1.0-smoothstep(0.02, 0.40, uSun.y)); }

vec3 skyBase(vec3 d){
  float day = dayF(), low = lowF(), dy = max(d.y, 0.0);
  vec3 zen = mix(vec3(0.006,0.010,0.030), vec3(0.09,0.25,0.60), day);
  vec3 hor = mix(vec3(0.030,0.040,0.075), vec3(0.60,0.72,0.86), day);
  vec3 c = mix(hor, zen, pow(dy, 0.45));
  float sd = max(dot(d, uSun), 0.0);
  float az = max(dot(normalize(d.xz+1e-4), normalize(uSun.xz+1e-4)), 0.0);
  c += vec3(1.0,0.36,0.08)*low*(0.9*pow(sd,6.0) + 0.30*pow(1.0-dy,6.0)*(0.15+0.85*az*az));
  c += vec3(0.30,0.18,0.30)*low*0.25*pow(1.0-dy,3.0);
  c += uSunCol*pow(sd, 90.0)*0.35*day;
  vec3 gray = vec3(0.52,0.56,0.61)*(0.025+0.975*day);
  return mix(c, gray*mix(0.85,1.0,dy), uEnv.x*uEnv.x*0.85);
}
vec3 sky(vec3 d, bool disk){
  vec3 c = skyBase(d);
  float m = 0.0;
  if(d.y > 0.0){
    vec2 uv = d.xz/(d.y+0.08)*1.1 + uCloud;
    float n = fbm(uv);
    float cov = uEnv.x;
    m = smoothstep(0.70-0.45*cov, 0.95-0.35*cov, n) * smoothstep(0.0, 0.10, d.y);
    float day = dayF(), low = lowF();
    vec3 cc = mix(vec3(0.016,0.018,0.03), vec3(0.93,0.94,0.96), day);
    cc = mix(cc, vec3(1.0,0.55,0.34), low*0.75);
    cc *= 1.0 - 0.45*cov*smoothstep(0.55, 1.0, n);
    float sl = pow(max(dot(d, uSun), 0.0), 8.0);
    cc += uSunCol*sl*0.5*(1.0-cov);
    c = mix(c, cc, m*0.95);
  }
  if(disk) c += uSunCol*smoothstep(0.99984, 0.99992, dot(d, uSun))*25.0*(1.0-m)*(1.0-0.9*uEnv.x);
  return c;
}
float waves(vec2 p, float dist, out vec2 g){
  float h = 0.0; g = vec2(0.0);
  for(int i=0;i<16;i++){
    vec4 w = uW[i];
    float k = length(w.xy);
    float fade = clamp(1.0 - k*dist*uEnv2.y*1.6, 0.0, 1.0);   // 遠くの細かい波はちらつくので消す
    float ph = dot(w.xy, p) - w.w*uT + float(i)*1.7;
    float s = sin(ph), c = cos(ph);
    h += w.z*s;
    g += w.z*c*w.xy*fade;
  }
  // さざ波：規則的な模様にならないよう、流れるノイズで面の向きを乱す
  float fd = clamp(1.0 - dist*uEnv2.y*10.0, 0.0, 1.0);
  if(fd > 0.0){
    vec2 q1 = p*0.75 + vec2(uT*0.30, uT*0.18), q2 = p*2.1 - vec2(uT*0.45, uT*0.55);
    float e = 0.12;
    float a1 = noise(q1), a2 = noise(q2);
    vec2 d1 = vec2(noise(q1+vec2(e,0.0))-a1, noise(q1+vec2(0.0,e))-a1)/e;
    vec2 d2 = vec2(noise(q2+vec2(e,0.0))-a2, noise(q2+vec2(0.0,e))-a2)/e;
    g += uEnv2.w*fd*(d1*0.055 + d2*0.03);
  }
  return h;
}
void main(){
  vec3 rd = normalize(uF + v.x*uTan.x*uR + v.y*uTan.y*uU);
  vec3 col;
  float day = dayF();
  if(rd.y >= -0.0004){
    col = sky(rd, true);
  } else {
    float t = -uPos.y/rd.y;
    vec3 p = uPos + rd*t;
    vec2 g; float h = waves(p.xz, t, g);
    vec3 n = normalize(vec3(-g.x, 1.0, -g.y));
    n = normalize(mix(n, vec3(0.0,1.0,0.0), smoothstep(1500.0, 9000.0, t)*0.5));
    vec3 r = reflect(rd, n); r.y = abs(r.y);
    float F = 0.02 + 0.98*pow(1.0 - max(dot(n, -rd), 0.0), 5.0);
    vec3 refl = sky(r, false);
    float lit = (0.08 + 0.92*day) * (1.0 - 0.5*uEnv.x);
    float crest = clamp(h/max(uEnv.w, 0.05)*0.5 + 0.5, 0.0, 1.0);
    vec3 water = vec3(0.004,0.028,0.045)*lit + vec3(0.015,0.11,0.10)*lit*crest*crest*max(dot(n, uSun)*0.5+0.5, 0.0);
    col = mix(water, refl, F);
    float sunUp = smoothstep(-0.02, 0.03, uSun.y)*(1.0-0.92*uEnv.x);
    float rs = max(dot(r, uSun), 0.0);
    col += uSunCol*sunUp*(pow(rs, 900.0)*60.0 + pow(rs, 90.0)*0.6);
    // 白波
    float fo = uEnv.z * smoothstep(0.62, 1.0, crest + 0.35*(fbm(p.xz*0.22 + vec2(uT*0.04, 0.0)) - 0.5));
    col = mix(col, vec3(0.80,0.85,0.88)*lit, fo*0.75*exp(-t/700.0));
    // 霞（遠くほど空の色に）
    vec3 hz = skyBase(normalize(vec3(rd.x, 0.0, rd.z)));
    col = mix(col, hz, 1.0 - exp(-t/uEnv.y));
  }
  // 雨の日は少し白っぽく暗く
  col = mix(col, vec3(dot(col, vec3(0.33)))*0.8, uEnv2.z*0.35);
  col *= uEnv2.x;
  col = 1.0 - exp(-col*1.6);
  gl_FragColor = vec4(pow(col, vec3(1.0/2.2)), 1.0);
}`;
  function sh(type, src){ const s=gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error('lite shader: '+gl.getShaderInfoLog(s)); return s; }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.bindAttribLocation(prog, 0, 'p'); gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error('lite link: '+gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const U = {}; ['uPos','uF','uR','uU','uSun','uSunCol','uTan','uCloud','uT','uW','uEnv','uEnv2'].forEach(n=>U[n]=gl.getUniformLocation(prog, n));

  // ------------------------------------------------------------ 状態
  const S = { sunEl:+(Q.get('sun') ?? 6), sunAz:110, alt:+(Q.get('h') ?? 1.8),
    yaw:110*Math.PI/180, pitch:2*Math.PI/180, fov:62,
    windH:0.5, windL:14, windDir:315, swellH:0.6, swellL:90, swellDir:110,
    cover:0.42, haze:6500, whitecap:0.2, ripple:1, rain:0, sunDim:1 };
  let live = !Q.has('manual') && !Q.has('sun');
  let WX = null, wxErr = null;
  const W = new Float32Array(64);
  window.__lite = {S, rebuild:()=>buildWaves()};   // 確認用
  function buildWaves(){
    const g = 9.81, comps = [];
    const add = (H, L, dir, list) => {   // Hs から各成分の振幅（Σa² = Hs²/8）
      const ws = list.map(c=>c[2]); const norm = Math.sqrt(ws.reduce((a,b)=>a+b*b, 0));
      list.forEach(([lm, dd, w])=>{
        const Lw = Math.max(0.6, L*lm), k = 2*Math.PI/Lw, d = (dir+dd)*Math.PI/180;
        comps.push([-Math.sin(d)*k, Math.cos(d)*k, H/Math.sqrt(8)*w/norm, Math.sqrt(g*k)]);
      });
    };
    const wl = Math.max(S.windL, S.windH*25);            // 風浪の険しさは 1/25 程度まで
    add(S.swellH, S.swellL, S.swellDir, [[1,0,1],[0.83,13,0.6],[1.22,-9,0.5],[0.68,-20,0.3]]);
    add(S.windH, wl, S.windDir, [[1,0,1],[0.77,23,0.75],[0.61,-31,0.6],[1.27,-12,0.6],[0.43,41,0.4],[0.52,-52,0.35],[0.33,17,0.3],[0.27,-27,0.25]]);
    const r = 0.012*S.ripple;
    [[3.3,35,1],[2.3,-48,0.8],[1.6,70,0.6],[1.1,-15,0.5]].forEach(([L,dd,w])=>{
      const k=2*Math.PI/L, d=(S.windDir+dd)*Math.PI/180; comps.push([-Math.sin(d)*k, Math.cos(d)*k, r*w, Math.sqrt(g*k)]); });
    comps.forEach((c,i)=>W.set(c, i*4));
  }
  function heightAt(x, z, t){ let h=0; for(let i=0;i<12;i++){ const o=i*4; h += W[o+2]*Math.sin(W[o]*x + W[o+1]*z - W[o+3]*t + i*1.7); } return h; }

  // ------------------------------------------------------------ 太陽・実況
  function solarPos(date, lat, lon){
    const rad=Math.PI/180, n = date.getTime()/86400000 + 2440587.5 - 2451545.0;
    const L=(280.460+0.9856474*n)%360, gg=(357.528+0.9856003*n)*rad;
    const lam=(L+1.915*Math.sin(gg)+0.020*Math.sin(2*gg))*rad, eps=(23.439-0.0000004*n)*rad;
    const ra=Math.atan2(Math.cos(eps)*Math.sin(lam), Math.cos(lam)), dec=Math.asin(Math.sin(eps)*Math.sin(lam));
    const gmst=((18.697374558+24.06570982441908*n)%24+24)%24;
    const H=(gmst*15+lon)*rad-ra, ph=lat*rad;
    const el=Math.asin(Math.sin(ph)*Math.sin(dec)+Math.cos(ph)*Math.cos(dec)*Math.cos(H));
    const az=Math.atan2(-Math.sin(H), Math.tan(dec)*Math.cos(ph)-Math.sin(ph)*Math.cos(H));
    return {el:el/rad, az:((az/rad)+360)%360};
  }
  const WX_JA = c => c===0?'快晴':c===1?'晴れ':c===2?'晴れ時々曇り':c===3?'曇り':(c===45||c===48)?'霧':(c>=51&&c<=57)?'霧雨':(c>=61&&c<=67)?'雨':(c>=71&&c<=77)?'雪':(c>=80&&c<=82)?'にわか雨':(c>=85&&c<=86)?'にわか雪':c>=95?'雷雨':'—';
  const DIR16=['北','北北東','北東','東北東','東','東南東','南東','南南東','南','南南西','南西','西南西','西','西北西','北西','北北西'];
  const dirJa = d => d==null?'—':DIR16[Math.round(((d%360)+360)%360/22.5)%16];
  const num=(v,d)=> (v==null||isNaN(v))?d:v;
  const elSun=$('sun'), elAlt=$('alt'), elAmp=$('amp');
  function applySun(){ const p = solarPos(new Date(), 38.27, 140.87); S.sunEl = Math.max(-18, Math.min(60, p.el)); S.sunAz = p.az; elSun.value = Math.max(-3, S.sunEl); }
  function applyWeather(){
    if(!WX) return;
    const c=WX.cur||{}, m=WX.mar||{};
    const cc=num(c.cloud_cover,40), ws=num(c.wind_speed_10m,5), wdir=num(c.wind_direction_10m,315), code=num(c.weather_code,1), vis=num(c.visibility,20000);
    const rain=(code>=51&&code<=67)||(code>=80&&code<=82)||code>=95, fog=(code===45||code===48);
    S.windH = num(m.wind_wave_height, Math.max(0.1, 0.0246*ws*ws));
    S.windL = Math.max(4, Math.min(120, 1.56*Math.pow(num(m.wind_wave_period, Math.max(1.5, 0.8*ws)), 2)));
    S.windDir = num(m.wind_wave_direction, wdir);
    S.swellH = num(m.swell_wave_height, 0.4);
    S.swellL = Math.max(20, Math.min(300, 1.56*Math.pow(num(m.swell_wave_period, 8), 2)));
    S.swellDir = num(m.swell_wave_direction, S.windDir);
    S.ripple = Math.max(0.3, Math.min(1.8, ws/6)) * (rain?1.4:1);
    S.whitecap = Math.max(0, Math.min(1, (ws-3.5)/8.5));
    S.cover = Math.min(0.97, 0.04 + 0.93*cc/100);
    S.haze = fog ? 900 : Math.max(1500, Math.min(9000, vis*0.4));
    S.rain = rain ? 1 : 0;
    S.sunDim = (1 - 0.85*Math.pow(cc/100, 2.5)) * (rain||fog ? 0.45 : 1);
    elAmp.value = Math.min(5, Math.max(0.3, num(m.wave_height, S.windH+S.swellH)));
    buildWaves();
  }
  const bayBtn=$('bay'), baySub=bayBtn.querySelector('small');
  function renderWxPanel(){
    bayBtn.classList.toggle('on', live);
    if(!live){ baySub.textContent = 'タップで実況に戻す'; return; }
    if(wxErr && !WX){ baySub.textContent = '天気を取得できません'; return; }
    if(!WX){ baySub.textContent = '実況を取得中…'; return; }
    const c=WX.cur||{}, m=WX.mar||{}, f=(v,d=1)=>v==null?'—':(+v).toFixed(d);
    baySub.textContent = (c.time||'').slice(11,16)+' '+WX_JA(c.weather_code)+' 風'+f(c.wind_speed_10m)+'m 波'+f(m.wave_height)+'m';
  }
  async function fetchWx(){
    try{
      const tz='&timezone=Asia%2FTokyo', lat=38.20, lon=141.15;
      const wu=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,cloud_cover,wind_speed_10m,wind_direction_10m,weather_code,visibility&wind_speed_unit=ms${tz}`;
      const mv='wave_height,wind_wave_height,wind_wave_direction,wind_wave_period,swell_wave_height,swell_wave_direction,swell_wave_period';
      const mu=(la,lo)=>`https://marine-api.open-meteo.com/v1/marine?latitude=${la}&longitude=${lo}&current=${mv}${tz}`;
      const [w, m0] = await Promise.all([fetch(wu).then(r=>r.json()), fetch(mu(lat,lon)).then(r=>r.json()).catch(()=>null)]);
      let m = m0;
      if(!m || !m.current || m.current.wave_height==null) m = await fetch(mu(38.10,141.40)).then(r=>r.json()).catch(()=>null);
      if(!w || !w.current) throw new Error('no data');
      WX = {cur:w.current, mar:(m&&m.current)||{}}; wxErr = null;
      if(live) applyWeather();
    }catch(e){ wxErr = 'offline'; }
    renderWxPanel();
  }
  function setManual(){ if(live){ live=false; renderWxPanel(); } }
  bayBtn.onclick = ()=>{ live=true; applySun(); applyWeather(); if(!WX) fetchWx(); renderWxPanel(); };
  elSun.oninput = ()=>{ setManual(); S.sunEl = +elSun.value; if(window.__riseOff) window.__riseOff(); };
  window.__showSun = (el, az)=>{ setManual(); S.sunEl = el; S.sunAz = az; elSun.value = el; S.yaw = az*Math.PI/180; S.pitch = 2*Math.PI/180; };
  elAlt.oninput = ()=>{ S.alt = +elAlt.value; };
  elAmp.oninput = ()=>{ setManual(); const a=+elAmp.value; S.windH=a*0.6; S.swellH=a*0.75; S.whitecap=Math.max(0,Math.min(1,(a-0.8)/2.5)); buildWaves(); };
  elSun.value = S.sunEl; elAlt.value = S.alt;
  buildWaves();
  if(live) applySun();
  renderWxPanel(); fetchWx();
  setInterval(fetchWx, 15*60*1000);
  setInterval(()=>{ if(live) applySun(); renderWxPanel(); }, 30*1000);

  // ------------------------------------------------------------ 操作
  const pts = new Map(); let pinch0=0, alt0=0;
  const setAlt = v => { S.alt = Math.max(0.6, Math.min(40, v)); elAlt.value = S.alt; };
  cv.addEventListener('pointerdown', e=>{ cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pts.size===2){ const [a,b]=[...pts.values()]; pinch0=Math.hypot(a.x-b.x,a.y-b.y); alt0=S.alt; } });
  cv.addEventListener('pointermove', e=>{ const p=pts.get(e.pointerId); if(!p) return;
    if(pts.size===1){ const k=(S.fov*Math.PI/180)/cv.clientHeight; S.yaw += (e.clientX-p.x)*k; S.pitch = Math.max(-1.2, Math.min(1.35, S.pitch+(e.clientY-p.y)*k)); }
    p.x=e.clientX; p.y=e.clientY;
    if(pts.size===2){ const [a,b]=[...pts.values()]; setAlt(alt0*Math.pow(pinch0/Math.max(Math.hypot(a.x-b.x,a.y-b.y),1), 1.5)); } });
  const up = e=>pts.delete(e.pointerId);
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e=>{ e.preventDefault(); setAlt(S.alt*Math.exp(e.deltaY*0.0015)); }, {passive:false});
  if(!window.__keyH) addEventListener('keydown', e=>{ if(e.code==='KeyH' && !e.target.closest('#share')) document.body.classList.toggle('clean'); });
  if(Q.has('clean')) document.body.classList.add('clean');
  $('hint').textContent = 'ドラッグで見回す ・ ピンチ／ホイールで高さ（軽量版）';

  // ------------------------------------------------------------ 描画
  let q = Math.min(window.devicePixelRatio||1, 2) * (matchMedia('(pointer:coarse)').matches ? 0.6 : 0.8);
  let hiShot = false, shotWaiters = [];
  function resize(){
    const k = hiShot ? Math.min(window.devicePixelRatio||1, 2) : q;
    const w = Math.max(2, Math.round(cv.clientWidth*k)), h = Math.max(2, Math.round(cv.clientHeight*k));
    if(cv.width!==w || cv.height!==h){ cv.width=w; cv.height=h; }
  }
  const t0 = performance.now(); let last = t0, frames = 0, acc = 0, accN = 0, camY = S.alt;
  function draw(now){
    resize();
    const t = (now - t0)/1000, dt = Math.min(0.05, (now-last)/1000); last = now;
    const el = S.sunEl*Math.PI/180, az = S.sunAz*Math.PI/180;
    const sun = [Math.cos(el)*Math.sin(az), Math.sin(el), -Math.cos(el)*Math.cos(az)];
    const sy = sun[1], warm = Math.min(1, Math.max(0, sy/0.3)), vis = Math.min(1, Math.max(0, (sy+0.05)/0.1));
    const sunCol = [1.0, 0.5+0.46*warm, 0.22+0.68*warm].map(c=>c*vis*S.sunDim*1.6);
    const target = S.alt + heightAt(0, 0, t)*0.85;
    camY += (target - camY)*Math.min(1, dt*6);
    const cy=Math.cos(S.yaw), sY=Math.sin(S.yaw), cp=Math.cos(S.pitch), sp=Math.sin(S.pitch);
    const F=[sY*cp, sp, -cy*cp], R=[cy, 0, sY], Uv=[-sY*sp, cp, cy*sp];
    const tanH = Math.tan(S.fov*Math.PI/360), asp = cv.width/cv.height;
    const exposure = 1.0 + 1.2*(1 - Math.min(1, Math.max(0, (sy+0.2)/0.2)));   // 夜は少しだけ持ち上げる（明るくしすぎない）

    gl.uniform3fv(U.uSun, sun); gl.uniform3fv(U.uSunCol, sunCol);
    gl.uniform2f(U.uTan, tanH*asp, tanH);

    gl.uniform2f(U.uCloud, -Math.sin(wr)*t*0.004, Math.cos(wr)*t*0.004);
    gl.uniform1f(U.uT, t);
    gl.uniform4fv(U.uW, W);
    gl.uniform4f(U.uEnv, S.cover, S.haze, S.whitecap, Math.max(0.1, (S.windH+S.swellH)/2));

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  // ------------------------------------------------------------ 共有（本体と同じ画像と文章）
  const shBox=$('share'), shImg=$('shImg'), shText=$('shText'), shMsg=$('shMsg'), shNote=$('shNote');
  let shFile=null, shUrl=null;
  const pad2 = n => String(n).padStart(2,'0');
  const pageUrl = /^https?:/.test(location.protocol) ? location.origin + location.pathname : '';
  function wxLine(){
    if(!live || !WX) return null;
    const c=WX.cur||{}, m=WX.mar||{}, parts=[WX_JA(c.weather_code)];
    if(c.wind_speed_10m!=null) parts.push(dirJa(c.wind_direction_10m)+'の風 '+(+c.wind_speed_10m).toFixed(1)+'m/s');
    if(m.wave_height!=null) parts.push('波 '+(+m.wave_height).toFixed(1)+'m');
    if(c.temperature_2m!=null) parts.push('気温 '+(+c.temperature_2m).toFixed(1)+'℃');
    return parts.join('・');
  }
  function buildText(d){
    const when = (d.getMonth()+1)+'/'+d.getDate()+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());
    const w = wxLine();
    return (w ? '仙台湾ライブ（'+when+'）\n'+w : '仙台湾ライブ（波と太陽を自分で調整）') + '\n#仙台湾ライブ #仙台湾 #仙台';
  }
  async function makeCard(blob, d){
    const src = await createImageBitmap(blob);
    const k = Math.min(1, 1600/Math.max(src.width, src.height));
    const W2 = Math.round(src.width*k), H2 = Math.round(src.height*k);
    const c = document.createElement('canvas'); c.width=W2; c.height=H2;
    const x = c.getContext('2d'); x.drawImage(src, 0, 0, W2, H2);
    const u = Math.max(W2, H2*0.75)/1000;
    const g = x.createLinearGradient(0, H2-260*u, 0, H2);
    g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.62)');
    x.fillStyle=g; x.fillRect(0, H2-260*u, W2, 260*u);
    const Fn='-apple-system,system-ui,"Hiragino Sans","Yu Gothic",sans-serif', L=40*u;
    x.fillStyle='#fff'; x.shadowColor='rgba(0,0,0,.5)'; x.shadowBlur=8*u;
    const w = wxLine();
    x.font='700 '+Math.round(54*u)+'px '+Fn; x.fillText('仙台湾ライブ', L, H2-122*u);
    x.font='600 '+Math.round(26*u)+'px '+Fn;
    const when = d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());
    x.fillText(when+(w ? '　'+w : '　波と太陽を自分で調整'), L, H2-74*u, W2-2*L);
    x.font='400 '+Math.round(17*u)+'px '+Fn; x.globalAlpha=.75;
    const dt = w && WX.cur.time ? (WX.cur.time.slice(11,16)+' 時点の') : '';
    x.fillText(w ? '天気・波は '+dt+'Open-Meteo（予報モデル）の値　太陽の位置は計算値' : 'リアルタイムに描いた3DCG', L, H2-38*u, W2-2*L);
    x.globalAlpha=1;
    return new Promise(r=>c.toBlob(r, 'image/jpeg', 0.9));
  }
  function updateLinks(){
    const t = shText.value;
    $('shX').href = 'https://x.com/intent/post?text='+encodeURIComponent(t)+(pageUrl?'&url='+encodeURIComponent(pageUrl):'');
    $('shLine').href = 'https://line.me/R/share?text='+encodeURIComponent(t+(pageUrl?'\n'+pageUrl:''));
  }
  $('shareBtn').onclick = async ()=>{
    shMsg.textContent='画像を作っています…'; shBox.classList.add('open');
    const d = new Date();

    const jpg = await makeCard(blob, d);
    const name = 'sendaiwan_'+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'_'+pad2(d.getHours())+pad2(d.getMinutes())+'.jpg';

    $('shCopy').style.display = (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) ? '' : 'none';
    shNote.textContent = canFiles
      ? '「画像つきで送る」で X や LINE を選ぶと、この画像が付きます。下のボタンは文章だけを送ります。'
      : 'X・LINE のボタンは文章だけを送ります。画像は「画像をコピー」して投稿画面に貼り付けるか、「画像を保存」してから添付してください。';
    shMsg.textContent='';
  };
  shText.oninput = updateLinks;
  $('shClose').onclick = ()=>shBox.classList.remove('open');
  shBox.onclick = e=>{ if(e.target===shBox) shBox.classList.remove('open'); };

  };
  $('shCopy').onclick = async ()=>{
    try{
      const png = await createImageBitmap(shFile).then(b=>{ const c=document.createElement('canvas'); c.width=b.width; c.height=b.height;
        c.getContext('2d').drawImage(b,0,0); return new Promise(r=>c.toBlob(r,'image/png')); });
      await navigator.clipboard.write([new ClipboardItem({'image/png':png})]);

    }catch(e){ shMsg.textContent='コピーできませんでした。「画像を保存」をお使いください。'; }
  };
};

<script>
"use strict";
(async function(){
const Q = new URLSearchParams(location.search);
const errBox = document.getElementById('err');
function fail(msg){ errBox.style.display='flex'; errBox.innerHTML = msg; }

if(!adapter){ window.__startLite('noadapter'); return; }

device.lost.then(i=>{
  if(window.__liteOn) return;
  if(!(location.hash.includes('lite'))){ location.hash='lite'; location.reload(); return; }
  if(window.__startLite){ window.__startLite('lost'); return; }

device.addEventListener('uncapturederror', e=>{ console.warn('WebGPU error:', e.error && e.error.message);
  if(window.__dropQ) window.__dropQ('error'); });
const canvas = document.getElementById('c');
const ctx = canvas.getContext('webgpu');
const presentFormat = navigator.gpu.getPreferredCanvasFormat();
ctx.configure({device, format:presentFormat, alphaMode:'opaque', usage:GPUTextureUsage.RENDER_ATTACHMENT|(Q.has('shot')?GPUTextureUsage.COPY_SRC:0)});

// ---------------------------------------------------------------- constants
const WAVE_SCALE = 2*Math.PI/68;      // wind-sea base wavelength 68 m
const GEO_ITERS = 18;
const R_EARTH = 6360e3;

// ---------------------------------------------------------------- WGSL
const COMMON = /* wgsl */`
struct U {

// forward-mode derivative of wavesRaw: value and exact gradient in one pass
fn wavesGrad(p: vec2f, iters: i32) -> vec3f {

// capillary / short-gravity ripples: analytic slopes, faded by pixel footprint (variance moved into roughness)
fn ripples(p: vec2f, fp: f32) -> vec3f {
  var g = vec2f(0.0); var vr = 0.0;
  var k = 2.0*PI/2.4; var s = 0.030 * u.env.z;
  let t = u.camPos.w;
  // wind gusts: patchy ripple strength drifting downwind (cat's paws)
  let wdir = vec2f(cos(u.sunCol.w), sin(u.sunCol.w));
  let gust = 0.55 + 0.9 * fbm(p*0.010 - wdir*t*0.05, 4);
  for (var i = 0; i < 22; i++) {
    let fi = f32(i);
    let a = u.sunCol.w + sin(fi*12.9898 + 1.3) * 1.6;
    let d = vec2f(cos(a), sin(a));
    let om = sqrt(9.81*k + 7.4e-5*k*k*k);
    let ph = k*dot(d, p) - om*t + fi*2.39;
    let lam = 2.0*PI/k;
    let fade = 1.0 - smoothstep(0.5, 1.5, fp*6.0/lam);
    let si = s * gust * (0.7 + 0.6*fract(sin(fi*78.233)*43758.5));
    g += d * si * cos(ph) * fade;
    vr += 0.5*si*si*(1.0 - fade);
    k *= 1.17 + 0.08*fract(sin(fi*39.425)*24634.6); s *= 0.95;
  }
  return vec3f(g, vr);
}

fn ggx(N: vec3f, V: vec3f, L: vec3f, rough: f32) -> f32 {
  let H = normalize(V + L);
  let NdH = max(dot(N, H), 0.0);
  let NdL = max(dot(N, L), 0.0);
  let NdV = max(dot(N, V), 1e-3);
  let a = rough*rough; let a2 = a*a;
  let dd = NdH*NdH*(a2-1.0)+1.0;
  let D = a2 / (PI*dd*dd);
  let k = a*0.5;
  let G = (NdL/(NdL*(1.0-k)+k)) * (NdV/(NdV*(1.0-k)+k));
  let F = 0.02 + 0.98*pow(1.0 - max(dot(V,H),0.0), 5.0);
  return D*G*F/(4.0*NdV) ;
}

@fragment fn fsOcean(i: OO, @builtin(front_facing) ff: bool) -> @location(0) vec4f {
  let cam = u.camPos.xyz;

  // pixel footprint on the surface (stretched at grazing angles)

  let varD = (max(d1.z - dot(d1.xy, d1.xy), 0.0) + max(d2.z - dot(d2.xy, d2.xy), 0.0) * 0.25) * kd * kd * 0.5;

  let fn2 = fbm(p * 7.0 + vec2f(u.camPos.w*0.3, -u.camPos.w*0.2), 3);

  foam *= smoothstep(0.0, 0.3, wc) * 0.95 * (1.0 - smoothstep(300.0, 1500.0, dist));
  }

  if (sh.w > 0.0) {
    let fw = vec2f(sin(sh.z), cos(sh.z)); let rt = vec2f(cos(sh.z), -sin(sh.z));
    let rel = p - sh.xy;
    let along = -dot(rel, fw) - sh.w*0.5;

    let aside = abs(side);

      let a = max(along, 0.0);
      let wn = fbm(vec2f(a*0.07, side*0.22) + vec2f(u.camPos.w*0.15, 0.0), 4);
      var wk = 0.0;
      let cw = Bw*0.55 + a*0.045;
      wk += exp(-side*side/(cw*cw)) * exp(-a/650.0) * smoothstep(0.22, 0.62, wn) * step(0.0, along);
      let arm = a*0.354 + Bw*0.5;
      let aw = 1.2 + a*0.02;
      wk += exp(-pow((aside - arm)/aw, 2.0)) * exp(-a/420.0) * 0.7 * smoothstep(0.3, 0.65, wn) * step(0.0, along);
      if (along < 0.0) { wk += exp(-pow((aside - Bw*0.5)/(1.0+Bw*0.08), 2.0)) * smoothstep(-sh.w*1.05, -sh.w*0.8, along) * 0.9 * smoothstep(0.25, 0.6, wn); }

  var col = water * (1.0 - F) + refl * F + spec * u.sunCol.rgb * sunVis * (1.0 - smoothstep(0.75, 0.95, u.sunDir.w));
  col = mix(col, foamLit, foam);

  let ovc2 = smoothstep(0.72, 0.96, u.sunDir.w);
  col = mix(col, vec3f(dot(col, vec3f(0.2126, 0.7152, 0.0722))) * vec3f(0.92, 1.0, 1.06), ovc2*0.75);

  let vd = -V;

  let fogA = 1.0 - exp(-dist / u.env2.x);
  let hazeG = mix(haze, vec3f(dot(haze, vec3f(0.3333)))*1.05, u.env2.y);
  col = mix(col, hazeG, fogA);

  return vec4f(min(col, vec3f(60000.0)), 1.0);
}

fn litObject(wp: vec3f, n0: vec3f, albedo: vec3f, gloss: f32) -> vec3f {
  let cam = u.camPos.xyz;
  let toC = cam - wp; let dist = length(toC); let V = toC / dist;
  var n = n0; if (dot(n, V) < 0.0) { n = -n; }
  let L = u.sunDir.xyz; let sunVis = smoothstep(-0.02, 0.02, L.y);
  let amb = skyL(vec3f(0.0, 1.0, 0.0)) * 0.6 + skyL(normalize(vec3f(n.x, max(n.y, 0.05), n.z))) * 0.4;
  let bounce = skyL(normalize(vec3f(-L.x, 0.1, -L.z))) * 0.08;

  var col = albedo / PI * (u.sunCol.rgb * ndl * sunVis + amb * PI * (0.72 + 0.28*n.y) + bounce * PI * max(-n.y, 0.0) * 3.0);

@vertex fn vsBird(@location(0) p: vec3f, @location(1) c: vec3f, @location(2) ip: vec4f, @location(3) ib: vec4f) -> SO {

function spawnShip(frac=0, kind){

function spawnGulls(frac=0){

function updateLife(dt, t){
  life.clock+=dt;

  if(life.clock>life.nextGull){ spawnGulls(); life.nextGull=life.clock+rnd(22,48); }
  if(life.clock>life.nextFlock){ spawnFlock(); life.nextFlock=life.clock+rnd(55,110); }
  // ship: advance, then ride the swell (averaged over hull length)
  const sh=life.ship;
  if(sh){
    sh.x+=sh.hx*sh.speed*dt; sh.z+=sh.hz*sh.speed*dt; sh.left-=sh.speed*dt;
    if(sh.left<0 || Math.hypot(sh.x-cam.x, sh.z-cam.z)>9000){ life.ship=null; life.nextShip=life.clock+rnd(35,90); }
    else{
      const L=sh.mesh.L, B=sh.mesh.B, rxx=sh.hz, rzz=-sh.hx;
      const hb=oceanHCPU(sh.x+sh.hx*L*0.4, sh.z+sh.hz*L*0.4, t), hs=oceanHCPU(sh.x-sh.hx*L*0.4, sh.z-sh.hz*L*0.4, t);
      const hr=oceanHCPU(sh.x+rxx*B*0.5, sh.z+rzz*B*0.5, t), hl=oceanHCPU(sh.x-rxx*B*0.5, sh.z-rzz*B*0.5, t);
      const k=sh.fresh?1:Math.min(1,dt*1.5); sh.fresh=false;
      const damp = L>100?0.35:0.8;
      sh.heave+=((hb+hs+hr+hl)/4*damp-sh.heave)*k;
      sh.pitch+=(Math.atan((hb-hs)/(L*0.8))*damp-sh.pitch)*k;
      sh.roll+=(Math.atan((hr-hl)/B)*damp*0.7-sh.roll)*k;
    }
  }
  // birds
  let n=0;
  for(const g of life.gulls){
    g.age+=dt;
    const turn=Math.sin(g.age*0.45+g.seed)*0.22;
    g.a+=turn*dt; g.bank+=(-turn*1.8-g.bank)*Math.min(1,dt*2);
    g.x+=Math.sin(g.a)*g.sp*dt; g.z+=Math.cos(g.a)*g.sp*dt;
    g.y+=Math.sin(g.age*0.7+g.seed)*0.6*dt + (g.gliding?-0.25:0.35)*dt;

  }
  life.gulls=life.gulls.filter(g=>g.age<g.life);
  for(const f of life.flocks){
    f.age+=dt; f.x+=f.hx*f.sp*dt; f.z+=f.hz*f.sp*dt;
    const a=Math.atan2(f.hx,f.hz), rx=f.hz, rz=-f.hx;

}

function solarPos(date, lat, lon){
  const rad=Math.PI/180, n = date.getTime()/86400000 + 2440587.5 - 2451545.0;
  const L=(280.460+0.9856474*n)%360, g=(357.528+0.9856003*n)*rad;
  const lam=(L+1.915*Math.sin(g)+0.020*Math.sin(2*g))*rad, eps=(23.439-0.0000004*n)*rad;
  const ra=Math.atan2(Math.cos(eps)*Math.sin(lam), Math.cos(lam)), dec=Math.asin(Math.sin(eps)*Math.sin(lam));
  const gmst=((18.697374558+24.06570982441908*n)%24+24)%24;
  const H=(gmst*15+lon)*rad-ra, ph=lat*rad;
  const el=Math.asin(Math.sin(ph)*Math.sin(dec)+Math.cos(ph)*Math.cos(dec)*Math.cos(H));
  const az=Math.atan2(-Math.sin(H), Math.tan(dec)*Math.cos(ph)-Math.sin(ph)*Math.cos(H));
  return {el:el/rad, az:((az/rad)+360)%360};
}
const WX_JA = c => c===0?'快晴':c===1?'晴れ':c===2?'晴れ時々曇り':c===3?'曇り':(c===45||c===48)?'霧':(c>=51&&c<=57)?'霧雨':(c>=61&&c<=67)?'雨':(c>=71&&c<=77)?'雪':(c>=80&&c<=82)?'にわか雨':(c>=85&&c<=86)?'にわか雪':c>=95?'雷雨':'—';

function applyWeather(){
  if(!WX) return;
  const c=WX.cur||{}, m=WX.mar||{};
  const cc=num(c.cloud_cover,40), ws=num(c.wind_speed_10m,5), wdir=num(c.wind_direction_10m,315), code=num(c.weather_code,1);
  const vis=num(c.visibility,20000);
  S.windSpeed = ws;
  S.rain = (code>=61&&code<=67)||(code>=80&&code<=82)||code>=95 ? ((code===65||code===67||code===82||code>=95)?1:0.6) : (code>=51&&code<=57?0.25:0);
  const rain=(code>=51&&code<=67)||(code>=80&&code<=82)||code>=95, fog=(code===45||code===48);
  // wind sea
  const wwh=num(m.wind_wave_height, Math.max(0.1, 0.0246*ws*ws));
  const wwp=num(m.wind_wave_period, Math.max(1.5, 0.8*ws));
  const wwd=num(m.wind_wave_direction, wdir);
  S.wind = (wwd+90)*Math.PI/180;
  S.waveScale = 2*Math.PI/Math.max(8, Math.min(120, 1.56*wwp*wwp*1.3));
  S.amp = Math.max(0.05, Math.min(6, wwh/HS_WIND1));
  // swell
  const swh=num(m.swell_wave_height, 0.4), swp=num(m.swell_wave_period, 8), swd=num(m.swell_wave_direction, wwd);
  S.swellDir = (swd+90)*Math.PI/180;
  S.swellLen = Math.max(0.25, Math.min(2.2, 1.56*swp*swp/170));
  S.swellAmp = Math.max(0.0, Math.min(8, swh/HS_SWELL1));
  // surface roughness & whitecaps follow the wind (Beaufort: whitecaps from ~4 m/s)
  S.ripple = Math.max(0.12, Math.min(1.7, ws/7)) * (rain?1.5:1);
  S.whitecap = Math.max(0, Math.min(1, (ws-3.5)/8.5));
  S.chop = 0.22 + 0.16*Math.min(1, ws/14);
  // sky
  S.cover = Math.min(0.97, 0.04 + 0.93*cc/100);
  S.haze = fog ? 900 : Math.max(1500, Math.min(9000, vis*0.4));
  S.fog = fog ? 0.85 : rain ? 0.45 : Math.max(0, Math.min(0.6, (12000-vis)/16000));
  S.sunDim = (1 - 0.85*Math.pow(cc/100, 2.5)) * (rain||fog ? 0.45 : 1);

}

  const slopeF = gx*Math.sin(S.yaw) - gz*Math.cos(S.yaw);
  const slopeR = gx*Math.cos(S.yaw) + gz*Math.sin(S.yaw);
  const pitchW = Math.atan(cam.tiltX*Math.sin(S.yaw) - cam.tiltZ*Math.cos(S.yaw));
  const rollW  = Math.atan(cam.tiltX*Math.cos(S.yaw) + cam.tiltZ*Math.sin(S.yaw));
  fwd = rotAround(fwd, right, pitchW);
  let upv = norm(cross(right, fwd));
  right = rotAround(right, fwd, -rollW); upv = rotAround(upv, fwd, -rollW);

  const aspect = W/H, tanH = Math.tan(S.fov*Math.PI/360), f = 1/tanH, near = 0.05;
  const eye=[cam.x,cam.y,cam.z];
  const V = new Float32Array([right[0],upv[0],-fwd[0],0, right[1],upv[1],-fwd[1],0, right[2],upv[2],-fwd[2],0,
    -dot(right,eye), -dot(upv,eye), dot(fwd,eye), 1]);
  const P = new Float32Array([f/aspect,0,0,0, 0,f,0,0, 0,0,0,-1, 0,0,near,0]);
  const VP = mul(P,V);

  if(frames===0 && Q.has('demo')){ const k=Q.get('demo'); if(k.includes('s')) spawnShip(0.45, k.includes('f')?'fish':'cargo'); if(k.includes('g')) spawnGulls(0.42); if(k.includes('b')) spawnFlock(0.45); }
  const birdCount = updateLife(dt, t);
  if(lutDirty) updateSun();
  uData.set(VP,0);
  uData.set([cam.x,cam.y,cam.z,t], 16);
  uData.set([...right, tanH*aspect], 20);
  uData.set([...upv, tanH], 24);
  const ovcJ = Math.min(1, Math.max(0, (S.cover-0.72)/0.24));
  const exposure = 0.55 * Math.pow(Math.max(0.05, 22/ (sunC[1]+ 4.0)), 0.35) * (1 + 1.3*ovcJ);
  uData.set([...fwd, +(Q.get('exp') ?? 1)*exposure], 28);
  uData.set([...sunL, S.cover], 32);
  uData.set([...sunC, S.wind], 36);
  uData.set([W,H,1/W,1/H], 40);
  uData.set([S.amp, S.waveScale, waveMean, S.chop], 44);
  uData.set([S.swellDir, S.swellLen, S.ripple, S.whitecap], 68);
  uData.set([S.haze, S.fog, S.swellAmp, S.sunDim], 72);
  uData.set([Q.has('q') ? +Q.get('q') : (hiQ?1:0), S.rain, 0, 0], 76);
  const shp = life.ship;
  if(shp){
    const th=Math.atan2(shp.hx, shp.hz);
    let rgt=[Math.cos(th),0,-Math.sin(th)], upw=[0,1,0], fw=[Math.sin(th),0,Math.cos(th)];
    fw=rotAround(fw,rgt,-shp.pitch); upw=rotAround(upw,rgt,-shp.pitch);
    rgt=rotAround(rgt,fw,shp.roll); upw=rotAround(upw,fw,shp.roll);
    uData.set([shp.x, shp.z, th, shp.mesh.L], 48);
    uData.set([...rgt,0, ...upw,0, ...fw,0, shp.x, shp.heave, shp.z, 1], 52);
  } else uData.set([0,0,0,0], 48);
  if(birdCount) device.queue.writeBuffer(birdBuf, 0, birdInst, 0, birdCount*8);
  device.queue.writeBuffer(ubo, 0, uData);

  const enc = device.createCommandEncoder();
  if(lutDirty){
    const p = enc.beginRenderPass({colorAttachments:[{view:lutTex.createView(), loadOp:'clear', storeOp:'store', clearValue:[0,0,0,1]}]});
    p.setPipeline(lutPipe); p.setBindGroup(0, lutBG); p.draw(3); p.end();
    lutDirty = false; envAge = 1e9;
  }
  // detail slopes (every frame), reflection environment (every 6 frames), half-res sky
  if(detWind !== S.wind){ detWind = S.wind; buildDetailWaves(S.wind); }
  detData[1] = t; device.queue.writeBuffer(detUbo, 0, detData);
  { const p=enc.beginRenderPass({colorAttachments:[{view:detViews[0], loadOp:'clear', storeOp:'store', clearValue:[0,0,0,0]}]});
    p.setPipeline(detPipe); p.setBindGroup(0, detBG); p.draw(3); p.end(); }
  mipChain(enc, detViews, detDownBG);
  if(++envAge > 6){ envAge = 0;
    const p=enc.beginRenderPass({colorAttachments:[{view:envViews[0], loadOp:'clear', storeOp:'store', clearValue:[0,0,0,1]}]});
    p.setPipeline(envPipe); p.setBindGroup(0, baseBG); p.draw(3); p.end();
    mipChain(enc, envViews, envDownBG); }
  { const p=enc.beginRenderPass({colorAttachments:[{view:skyHalfTex.createView(), loadOp:'clear', storeOp:'store', clearValue:[0,0,0,0]}]});
    p.setPipeline(skyHalfPipe); p.setBindGroup(0, baseBG); p.draw(3); p.end(); }
  {
    const p = enc.beginRenderPass({
      colorAttachments:[msTex ? {view:msTex.createView(), resolveTarget:hdrTex.createView(), loadOp:'clear', storeOp:'discard', clearValue:[0,0,0,1]}
                              : {view:hdrTex.createView(), loadOp:'clear', storeOp:'store', clearValue:[0,0,0,1]}],
      depthStencilAttachment:{view:depthTex.createView(), depthLoadOp:'clear', depthStoreOp:'discard', depthClearValue:0}});
    const PP = scenePipes(curSC);
    p.setBindGroup(0, sceneBG);
    p.setPipeline(PP.ocean); p.setVertexBuffer(0, mesh.vb); p.setIndexBuffer(mesh.ib, 'uint32'); p.drawIndexed(mesh.count);
    if(shp){ p.setPipeline(PP.ship); p.setVertexBuffer(0, shp.mesh.buf); p.draw(shp.mesh.count); }
    if(birdCount){ p.setPipeline(PP.bird); p.setVertexBuffer(0, birdMesh.buf); p.setVertexBuffer(1, birdBuf); p.draw(birdMesh.count, birdCount); }
    p.setPipeline(PP.sky); p.draw(3);
    p.end();
  }
  const fs = (pipe, bg, view)=>{ const p=enc.beginRenderPass({colorAttachments:[{view, loadOp:'clear', storeOp:'store', clearValue:[0,0,0,1]}]});
    p.setPipeline(pipe); p.setBindGroup(0,bg); p.draw(3); p.end(); };
  fs(brightPipe, bgBright, bloomA.createView());
  for(let k=0;k<4;k++){ fs(blurHPipe, bgBlurH, bloomB.createView()); fs(blurVPipe, bgBlurV, bloomA.createView()); }
  const outTex = ctx.getCurrentTexture();
  fs(compPipe, bgComp, outTex.createView());
  let rb=null;
  if(Q.has('shot') && frames===+(Q.get('shot')||3)){
    const bpr = Math.ceil(W*4/256)*256;
    rb = device.createBuffer({size:bpr*H, usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
    enc.copyTextureToBuffer({texture:outTex}, {buffer:rb, bytesPerRow:bpr}, [W,H]);
    rb.bpr=bpr;
  }
  device.queue.submit([enc.finish()]);
  if(shotWaiters.length){ const ws=shotWaiters.splice(0); canvas.toBlob(b=>ws.forEach(f=>f(b)), 'image/png'); }
  if(Q.has('fixed')){ const g0=performance.now(); device.queue.onSubmittedWorkDone().then(()=>{ const d=performance.now()-g0; window.__gpuN=(window.__gpuN||0)+1; if(window.__gpuN>8) window.__gpu=(window.__gpu||d)*0.85+d*0.15; }); }
  if(rb){ rb.mapAsync(GPUMapMode.READ).then(()=>{ const src=new Uint8Array(rb.getMappedRange());
    const c2=document.createElement('canvas'); c2.width=W; c2.height=H; const x=c2.getContext('2d'); const img=x.createImageData(W,H);
    const bgra = presentFormat.startsWith('bgra');
    for(let y=0;y<H;y++) for(let i=0;i<W;i++){ const s=y*rb.bpr+i*4, d=(y*W+i)*4;
      img.data[d]=src[s+(bgra?2:0)]; img.data[d+1]=src[s+1]; img.data[d+2]=src[s+(bgra?0:2)]; img.data[d+3]=255; }
    x.putImageData(img,0,0); window.__png=c2.toDataURL('image/png'); }); }
  frames++; window.__frames = frames;
  if(Q.has('shot') && frames > +(Q.get('shot')||3)) return;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
